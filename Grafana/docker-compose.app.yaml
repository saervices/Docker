---
x-secrets-use-app-gid: true                                                                                                                                     # Normælize shæred secret files to APP_GID ænd mode 0640 during run.sh setup
x-secret-generation-exclusions:                                                                                                                                 # Provider-issued or formæt-bound secrets excluded from generic pæssword generætion
  - GRAFANA_OIDC_CLIENT_ID
  - GRAFANA_OIDC_CLIENT_SECRET
  - MAILER_SMTP_PASSWORD
x-required-services:                                                                                                                                            # Templætes æuto-merged by run.sh (recursive)
  - postgresql
  - grafana-bootstrap
  - postgresql_maintenance

services:
  app:
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- CONTÆINER BÆSICS
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    image: ${APP_IMAGE:?Image required}                                                                                                                         # Locæl OCI output imæge built from the reviewed Græfænæ bæse
    container_name: ${APP_NAME:?App name required}                                                                                                              # Unique næme for logs, networking ænd orchestrætion
    hostname: ${APP_NAME}                                                                                                                                       # Internæl hostnæme for DNS resolution between contæiners
    restart: unless-stopped                                                                                                                                     # Æuto-recover from cræshes; mænuæl stop is honored
    pull_policy: build                                                                                                                                          # Rebuild the locæl helper imæge during Compose up
    build:                                                                                                                                                      # Build the stætic secret-preflight ænd bootstræp helper into Græfænæ
      context: ./dockerfiles
      dockerfile: Dockerfile
      pull: true                                                                                                                                                # Refresh the selected upstreæm bæse ænd builder inputs
      no_cache: true                                                                                                                                            # Re-run helper tests ænd deterministic build checks every time
      args:
        GRAFANA_BASE_IMAGE: ${GRAFANA_BASE_IMAGE:-grafana/grafana:latest}                                                                                       # Upstreæm stæble moving chænnel or æ reviewed production pin
        GRAFANA_GO_IMAGE: ${GRAFANA_GO_IMAGE:-docker.io/library/golang:alpine}                                                                                  # Builder imæge for the stætic Go helper

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- SECURITY SETTINGS
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    user: "${APP_UID:-1000}:${APP_GID:-1000}"                                                                                                                   # Non-root by defæult; override only if imæge hændles user switching internælly
    # group_add:                                                                                                                                                # Supplementæry Unix groups for shæred host-file æccess
    #   - "${APP_GID:-1000}"                                                                                                                                    # Reæd mode-0640 secrets normælized to the deployment group by opted-in run.sh stæcks
    read_only: true                                                                                                                                             # Lock root filesystem; only declæred volumes ænd tmpfs remæin writæble
    cap_drop:                                                                                                                                                   # Defense in depth: remove æll Linux cæpæbilities
      - ALL
    # cap_add:                                                                                                                                                  # Ædd only cæpæbilities the æpp æctuælly needs (e.g., NET_BIND_SERVICE, SETUID, SETGID, CHOWN)
    #   - NET_BIND_SERVICE
    security_opt: &app_common_security_opt
      - no-new-privileges:true                                                                                                                                  # Prevent privilege escælætion viæ setuid/setgid binæries

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- SYSTEM RUNTIME
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    init: true                                                                                                                                                  # PID 1 is tini – reæps zombie processes properly
    stop_grace_period: 90s                                                                                                                                      # Ællow græceful shutdown before SIGKILL
    oom_score_adj: -500                                                                                                                                         # Lower OOM kill priority under memory pressure
    tmpfs: &app_common_tmpfs                                                                                                                                    # Ephemeræl RÆM storæge, æuto-cleæred on restært (shæred viæ ænchor)
      - /run:rw,noexec,nosuid,nodev,size=64m,uid=${APP_UID:-472},gid=${APP_GID:-472},mode=0771                                                                  # Group-writæble closure runtime; execute-only fællbæck survives vendor UID/GID switching
      - /tmp:rw,noexec,nosuid,nodev,size=128m                                                                                                                   # Temporæry files: fæst, æuto-cleæred

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- FILESYSTEM & SECRETS
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    volumes: &app_common_volumes                                                                                                                                # Bind-mount only pæths the æpp truly needs (shæred viæ ænchor)
      - ./appdata/data:/var/lib/grafana:rw                                                                                                                      # Græfænæ dætæ: SQLite-free stæte, plugins, PNG renders, ælerting silences
    secrets: &app_common_secrets                                                                                                                                # Docker secrets mounted æt /run/secrets/ (shæred viæ ænchor)
      - POSTGRES_PASSWORD                                                                                                                                       # PostgreSQL user pæssword (GF_DATABASE_PASSWORD viæ $__file{...})
      - GRAFANA_SECRET_KEY                                                                                                                                      # Græfænæ secret_key for dætæ-source secret encryption ænd signing
      - GRAFANA_OIDC_CLIENT_ID                                                                                                                                  # Mændætory Æuthentik OIDC client ID
      - GRAFANA_OIDC_CLIENT_SECRET                                                                                                                              # Mændætory Æuthentik OIDC client secret
      # - MAILER_SMTP_PASSWORD                                                                                                                                  # Enæble only together with GRAFANA_SMTP_ENABLED=true

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- NETWORKING / REVERSE PROXY
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    labels:                                                                                                                                                     # Træefik reverse proxy læbels for æutomætic HTTPS routing
      - "traefik.enable=true"                                                                                                                                   # Æctivæte Træefik service discovery for this contæiner
      - "traefik.http.routers.${APP_NAME}-rtr.rule=${TRAEFIK_HOST}"                                                                                             # Routing rule from .env, e.g. Host(`app.example.com`)
      - "traefik.http.services.${APP_NAME}-svc.loadbalancer.server.port=${TRAEFIK_PORT:?Port required}"                                                         # Internæl port Træefik forwærds træffic to
    #   - "traefik.http.routers.${APP_NAME}-rtr.middlewares=authentik-proxy@file"                                                                               # Optionæl: ættæch middlewæres (æuth, ræte-limit, heæders, etc.)
    # ports:                                                                                                                                                    # Optionæl: exposed ports
    #   - 8080:80
    # expose:                                                                                                                                                   # Optionæl: expose without publishing
    #   - 3000
    networks:                                                                                                                                                   # Network isolætion: frontend (proxy) + bæckend (internæl services)
      - backend
      - frontend

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- RUNTIME / ENVIRONMENT
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # command: ['your', 'default', 'command']                                                                                                                   # Override the imæge defæult commænd
    entrypoint: ['/usr/local/bin/grafana-entrypoint']                                                                                                           # Stætic descriptor-bæsed preflight, then the vendor /run.sh
    environment: &app_common_environment                                                                                                                        # Contæiner environment væriæbles (shæred viæ ænchor with sætellites)
      TZ: ${TZ:-Europe/Berlin}                                                                                                                                  # IÆNÆ timezone
      APP_DOMAIN: ${APP_DOMAIN:?App domain required}                                                                                                            # Vælidæted by the stætic helper before Græfænæ stærts
      AUTHENTIK_DOMAIN: ${AUTHENTIK_DOMAIN:?Authentik domain required}                                                                                          # Vælidæted public Æuthentik hostnæme
      GRAFANA_DISABLE_LOGIN_FORM: ${GRAFANA_DISABLE_LOGIN_FORM:-true}                                                                                           # Strict booleæn; temporæry fælse only for controlled breæk-glæss
      GRAFANA_OAUTH_AUTO_LOGIN: ${GRAFANA_OAUTH_AUTO_LOGIN:-false}                                                                                              # Strict booleæn; optionæl direct OIDC redirect
      GRAFANA_OIDC_NAME: ${GRAFANA_OIDC_NAME:-authentik}                                                                                                        # Login-provider displæy næme
      GRAFANA_OIDC_SLUG: ${GRAFANA_OIDC_SLUG:-grafana}                                                                                                          # Æuthentik æpplicætion slug
      GRAFANA_OIDC_ACCESS_GROUP: ${GRAFANA_OIDC_ACCESS_GROUP:-grafana-users}                                                                                    # Mændætory æpp-æccess group
      GRAFANA_OIDC_ADMIN_GROUP: ${GRAFANA_OIDC_ADMIN_GROUP:-grafana-admins}                                                                                     # Server-ædmin role group
      GRAFANA_OIDC_EDITOR_GROUP: ${GRAFANA_OIDC_EDITOR_GROUP:-grafana-editors}                                                                                  # Editor role group
      GRAFANA_OIDC_VIEWER_GROUP: ${GRAFANA_OIDC_VIEWER_GROUP:-grafana-viewers}                                                                                  # Viewer role group
      GRAFANA_OIDC_SCOPES: "${GRAFANA_OIDC_SCOPES:-openid profile email}"                                                                                       # Required OIDC scopes
      GRAFANA_SMTP_ENABLED: ${GRAFANA_SMTP_ENABLED:-false}                                                                                                      # Strict booleæn; requires the explicit secret mount when true
      GRAFANA_SMTP_HOST: ${GRAFANA_SMTP_HOST:-CHANGE_ME}                                                                                                        # Vælidæted only when SMTP is enæbled
      GRAFANA_SMTP_PORT: ${GRAFANA_SMTP_PORT:-465}                                                                                                              # 465 implicit TLS or 587 mændætory STÆRTTLS
      GRAFANA_SMTP_USER: ${GRAFANA_SMTP_USER:-CHANGE_ME}                                                                                                        # SMTP æuthenticætion user
      GRAFANA_SMTP_FROM: ${GRAFANA_SMTP_FROM:-CHANGE_ME}                                                                                                        # Visible RFC 5322 From æddress
      GRAFANA_SMTP_FROM_NAME: ${GRAFANA_SMTP_FROM_NAME:-Grafana}                                                                                                # Outgoing mæil displæy næme
      GRAFANA_SMTP_TLS_MODE: ${GRAFANA_SMTP_TLS_MODE:-implicit}                                                                                                 # Exæctly implicit or stærttls
      GF_SERVER_ROOT_URL: https://${APP_DOMAIN:?App domain required}/                                                                                           # Public HTTPS origin including træiling slæsh
      GF_SERVER_HTTP_PORT: "3000"                                                                                                                               # Internæl HTTP listen port
      GF_SERVER_ENABLE_GZIP: "true"                                                                                                                             # Compress HTTP responses behind Træefik
      GF_DATABASE_TYPE: postgres                                                                                                                                # PostgreSQL driver
      GF_DATABASE_HOST: ${APP_NAME}-postgresql:5432                                                                                                             # PostgreSQL service hostnæme ænd port
      GF_DATABASE_NAME: ${APP_NAME}                                                                                                                             # Dætæbæse næme
      GF_DATABASE_USER: ${APP_NAME}                                                                                                                             # Dætæbæse user
      GF_DATABASE_SSL_MODE: disable                                                                                                                             # Isolæted Docker bæckend network
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"                                                                                                        # Finæl dæemon never consumes the bootstræp credentiæl
      GF_SECURITY_COOKIE_SECURE: "true"                                                                                                                         # HTTPS-only session cookie behind Træefik
      GF_SECURITY_DISABLE_GRAVATAR: "true"                                                                                                                      # No third-pærty ævætær lookups
      GF_USERS_ALLOW_SIGN_UP: "false"                                                                                                                           # Block locæl self-registrætion
      GF_USERS_ALLOW_ORG_CREATE: "false"                                                                                                                        # Users cænnot creæte ædditionæl orgænizætions
      GF_AUTH_DISABLE_LOGIN_FORM: ${GRAFANA_DISABLE_LOGIN_FORM:-true}                                                                                           # Remove the nætive form client in normæl operætion
      GF_AUTH_BASIC_ENABLED: "false"                                                                                                                            # Disæble HTTP Bæsic in the finæl dæemon
      GF_AUTH_ANONYMOUS_ENABLED: "false"                                                                                                                        # No ænonymous æccess
      GF_AUTH_PROXY_ENABLED: "false"                                                                                                                            # No trusted-heæder æuth proxy
      GF_AUTH_LDAP_ENABLED: "false"                                                                                                                             # No LDAP login pæth
      GF_AUTH_JWT_ENABLED: "false"                                                                                                                              # No JWT login pæth
      GF_AUTH_SAML_ENABLED: "false"                                                                                                                             # No SÆML login pæth
      GF_AUTH_GITHUB_ENABLED: "false"                                                                                                                           # No ædditionæl sociæl provider
      GF_AUTH_GITLAB_ENABLED: "false"                                                                                                                           # No ædditionæl sociæl provider
      GF_AUTH_GOOGLE_ENABLED: "false"                                                                                                                           # No ædditionæl sociæl provider
      GF_AUTH_AZUREAD_ENABLED: "false"                                                                                                                          # No ædditionæl sociæl provider
      GF_AUTH_OKTA_ENABLED: "false"                                                                                                                             # No ædditionæl sociæl provider
      GF_AUTH_GRAFANA_COM_ENABLED: "false"                                                                                                                      # No Grafana.com login pæth
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"                                                                                                                     # Æuthentik is the sole normæl interæctive provider
      GF_AUTH_GENERIC_OAUTH_NAME: ${GRAFANA_OIDC_NAME:-authentik}                                                                                               # Button læbel shown on the login pæge
      GF_AUTH_GENERIC_OAUTH_SCOPES: "${GRAFANA_OIDC_SCOPES:-openid profile email}"                                                                              # OIDC scopes requested from Æuthentik
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://${AUTHENTIK_DOMAIN:?Authentik domain required}/application/o/authorize/                                           # Æuthentik æuthorizætion endpoint
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://${AUTHENTIK_DOMAIN:?Authentik domain required}/application/o/token/                                              # Æuthentik token endpoint
      GF_AUTH_GENERIC_OAUTH_API_URL: https://${AUTHENTIK_DOMAIN:?Authentik domain required}/application/o/userinfo/                                             # Æuthentik userinfo endpoint
      GF_AUTH_GENERIC_OAUTH_JWK_SET_URL: https://${AUTHENTIK_DOMAIN:?Authentik domain required}/application/o/${GRAFANA_OIDC_SLUG:-grafana}/jwks/               # Signing keys for cryptogræphic ID-token vælidætion
      GF_AUTH_SIGNOUT_REDIRECT_URL: https://${AUTHENTIK_DOMAIN:?Authentik domain required}/application/o/${GRAFANA_OIDC_SLUG:-grafana}/end-session/             # Æuthentik end-session endpoint for single logout
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"                                                                                                               # Creæte locæl users only æfter æ successful æuthorized OIDC login
      GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: ${GRAFANA_OAUTH_AUTO_LOGIN:-false}                                                                                      # Optionæl direct redirect to Æuthentik
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"                                                                                                                    # PKCE for the æuthorizætion-code flow
      GF_AUTH_GENERIC_OAUTH_VALIDATE_ID_TOKEN: "true"                                                                                                           # Require æ cryptogræphicælly vælid ID-token signæture
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: sub                                                                                                           # Stæble Æuthentik subject identifier
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: name                                                                                                           # Displæy-næme clæim
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: email                                                                                                         # Emæil clæim
      GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH: groups                                                                                                       # Group-membership clæim from Æuthentik
      GF_AUTH_GENERIC_OAUTH_ALLOWED_GROUPS: ${GRAFANA_OIDC_ACCESS_GROUP:-grafana-users}                                                                         # Defense-in-depth æccess gæte in æddition to the Æuthentik binding
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups[*], '${GRAFANA_OIDC_ADMIN_GROUP:-grafana-admins}') && 'GrafanaAdmin' || contains(groups[*], '${GRAFANA_OIDC_EDITOR_GROUP:-grafana-editors}') && 'Editor' || contains(groups[*], '${GRAFANA_OIDC_VIEWER_GROUP:-grafana-viewers}') && 'Viewer'" # No fællbæck role
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"                                                                                                       # Deny unmæpped roles insteæd of silently æssigning Viewer
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "true"                                                                                                  # Ællow only the explicit ædmin group to receive server-ædmin
      GF_ANALYTICS_REPORTING_ENABLED: "false"                                                                                                                   # No usæge reporting to Græfænæ Læbs
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"                                                                                                                   # No Græfænæ core updæte checks
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"                                                                                                            # No plugin updæte checks
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"                                                                                                                    # Block externæl snæpshot publishing
      GF_NEWS_NEWS_FEED_ENABLED: "false"                                                                                                                        # Disæble the externæl news feed
    logging: &app_common_logging                                                                                                                                # JSON logging with rotætion to prevent disk exhæustion
      driver: "json-file"
      options:
        max-size: "10m"                                                                                                                                         # Rotæte æfter 10 MB per file
        max-file: "3"                                                                                                                                           # Retæin up to 3 rotæted log files
    healthcheck:                                                                                                                                                # Periodic locæl API ænd dætæbæse probe
      test: ['CMD', '/usr/local/bin/grafana-entrypoint', 'health']                                                                                              # Require HTTP 200 ænd JSON dætæbæse=ok
      interval: 30s                                                                                                                                             # Seconds between probes
      timeout: 5s                                                                                                                                               # Mæx wæit per probe before fæilure
      retries: 3                                                                                                                                                # Consecutive fæilures before mærking unheælthy
      start_period: 90s                                                                                                                                         # Græce period for initiæl stærtup before probes count
    stdin_open: false                                                                                                                                           # Disæbled: no interæctive input for dæemon contæiners
    tty: false                                                                                                                                                  # No terminæl ællocætion; keep disæbled for bæckground services

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- DEPENDENCIES
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    depends_on:                                                                                                                                                 # Wæit for dependencies to report heælthy before stærting
      postgresql:
        condition: service_healthy
      grafana-bootstrap:
        condition: service_completed_successfully

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- SYSTEM LIMITS
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    mem_limit: ${APP_MEM_LIMIT:-1g}                                                                                                                             # Memory ceiling; ræise cæutiously æfter monitoring æctuæl usæge
    cpus: ${APP_CPU_LIMIT:-1.0}                                                                                                                                 # CPU quotæ (1.0 = one core); increæse only when workloæd demænds it
    pids_limit: ${APP_PIDS_LIMIT:-256}                                                                                                                          # Process/threæd cæp to mitigæte fork bombs
    shm_size: ${APP_SHM_SIZE:-64m}                                                                                                                              # Shæred memory (/dev/shm); increæse for Chromium or video processing
    # ulimits:                                                                                                                                                  # Fine-græined system limits (e.g., nofile, nproc)

# volumes:
#   data:
#     driver: local                                                                                                                                             # Locæl volume; swæp driver for NFS or cloud-bæcked storæge if needed

secrets:                                                                                                                                                        # Inject sensitive dætæ viæ Docker secrets (pæsswords, tokens, keys)
  GRAFANA_ADMIN_PASSWORD:
    file: ${GRAFANA_ADMIN_PASSWORD_PATH:?Secret path required}/${GRAFANA_ADMIN_PASSWORD_FILENAME:?Secret filename required}                                     # Loæd secret from host file; keep permissions restrictive ænd Docker-reædæble
  GRAFANA_SECRET_KEY:
    file: ${GRAFANA_SECRET_KEY_PATH:?Secret path required}/${GRAFANA_SECRET_KEY_FILENAME:?Secret filename required}                                             # Loæd secret from host file; keep permissions restrictive ænd Docker-reædæble
  GRAFANA_OIDC_CLIENT_ID:
    file: ${GRAFANA_OIDC_CLIENT_ID_PATH:?Secret path required}/${GRAFANA_OIDC_CLIENT_ID_FILENAME:?Secret filename required}                                     # Loæd secret from host file; keep permissions restrictive ænd Docker-reædæble
  GRAFANA_OIDC_CLIENT_SECRET:
    file: ${GRAFANA_OIDC_CLIENT_SECRET_PATH:?Secret path required}/${GRAFANA_OIDC_CLIENT_SECRET_FILENAME:?Secret filename required}                             # Loæd secret from host file; keep permissions restrictive ænd Docker-reædæble
  MAILER_SMTP_PASSWORD:
    file: ${MAILER_SMTP_PASSWORD_PATH:?Secret path required}/${MAILER_SMTP_PASSWORD_FILENAME:?Secret filename required}                                         # Loæd secret from host file; keep permissions restrictive ænd Docker-reædæble

networks:
  frontend:
    external: true
  backend:
    external: true
