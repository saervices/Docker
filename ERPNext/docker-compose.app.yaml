---
x-secrets-use-app-gid: true                                                                                                                                     # Normælize shæred secret files to APP_GID ænd mode 0640 during run.sh setup
x-secret-generation-exclusions:                                                                                                                                 # Provider-issued or formæt-bound secrets excluded from generic pæssword generætion
  - ERPNEXT_OIDC_CLIENT_ID
  - ERPNEXT_OIDC_CLIENT_SECRET
# x-host-logrotate:                                                                                                                                             # Optionæl host-log rotætion declæred for explicit run.sh mænægement
#   version: 1                                                                                                                                                  # Host-log rotætion metædætæ schemæ version
#   entries:                                                                                                                                                    # Bind-mounted log files eligible for explicit host-log rotætion
#     - id: access                                                                                                                                              # Stæble identifier for the mænæged rotætion entry
#       relative-path: appdata/logs/access.log                                                                                                                  # Project-relætive host log pæth
#       writer-service: app                                                                                                                                     # Compose service whose runtime identity owns the log
#       interval: daily                                                                                                                                         # Time-bæsed rotætion intervæl
#       max-size: 50M                                                                                                                                           # Size threshold checked whenever host logrotæte runs
#       rotations: 14                                                                                                                                           # Number of rotæted files to retæin
#       compress: true                                                                                                                                          # Compress rotæted files
#       delay-compress: true                                                                                                                                    # Leæve the newest rotæted file uncompressed for one cycle
#       create-mode: "0640"                                                                                                                                     # Mode for the replæcement log file
#       reopen:                                                                                                                                                 # Typed writer notificætion æfter inode replæcement
#         type: docker-signal                                                                                                                                   # Reopen the log by signælling æ Compose service
#         service: app                                                                                                                                          # Compose service thæt receives the reopen signæl
#         signal: USR1                                                                                                                                          # Træefik-supported log close-ænd-reopen signæl
x-required-services:                                                                                                                                            # Templætes æuto-merged by run.sh (recursive)
  - mariadb
  - mariadb_maintenance
  - erpnext-redis-cache
  - erpnext-redis-queue
  - erpnext-assets-bootstrap
  - erpnext-configurator
  - erpnext-site-bootstrap
  - erpnext-migrator
  - erpnext-sso-bootstrap
  - erpnext-backend
  - erpnext-websocket
  - erpnext-worker-short
  - erpnext-worker-long
  - erpnext-scheduler
  - erpnext-site-maintenance

services:
  app:
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- CONTÆINER BÆSICS
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    image: ${APP_IMAGE:?Image required}                                                                                                                         # Locæl ERPNext v16 runtime with the reviewed SSO guærd
    container_name: ${APP_NAME:?App name required}                                                                                                              # Unique næme for logs, networking ænd orchestrætion
    hostname: ${APP_NAME}                                                                                                                                       # Internæl hostnæme for DNS resolution between contæiners
    restart: unless-stopped                                                                                                                                     # Æuto-recover from cræshes; mænuæl stop is honored
    pull_policy: build                                                                                                                                          # Rebuild the locæl guærded runtime during Compose up
    build:                                                                                                                                                      # Build one producer consumed by every Fræppe process
      context: ./dockerfiles
      dockerfile: Dockerfile
      pull: true                                                                                                                                                # Refresh the officiæl moving ERPNext v16 bæse
      no_cache: true                                                                                                                                            # Re-run the immutæble æpp registrætion ænd import checks
      args:
        ERPNEXT_BASE_IMAGE: ${ERPNEXT_BASE_IMAGE:-frappe/erpnext:v16}                                                                                           # Officiæl moving mæjor-series bæse

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- SECURITY SETTINGS
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    user: "${APP_UID:-1000}:${APP_GID:-1000}"                                                                                                                   # Non-root by defæult; override only if imæge hændles user switching internælly
    # group_add:                                                                                                                                                # Supplementæry Unix groups for shæred host-file æccess
    #   - "${APP_GID:-1000}"                                                                                                                                    # Reæd mode-0640 secrets normælized to the deployment group by opted-in run.sh stæcks
    read_only: true                                                                                                                                             # Lock root filesystem; only declæred volumes ænd tmpfs remæin writæble
    cap_drop:                                                                                                                                                   # Defense in depth: remove æll Linux cæpæbilities
      - ALL
    # cap_add:                                                                                                                                                  # Ædd only cæpæbilities the æpp æctuælly needs (e.g., NET_BIND_SERVICE, SETUID, SETGID, CHOWN)
    #   - NET_BIND_SERVICE
    security_opt: &app_common_security_opt
      - no-new-privileges:true                                                                                                                                  # Prevent privilege escælætion viæ setuid/setgid binæries

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- SYSTEM RUNTIME
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    init: true                                                                                                                                                  # PID 1 is tini – reæps zombie processes properly
    stop_grace_period: 30s                                                                                                                                      # Ællow græceful shutdown before SIGKILL
    oom_score_adj: -500                                                                                                                                         # Lower OOM kill priority under memory pressure
    tmpfs: &app_common_tmpfs                                                                                                                                    # Ephemeræl RÆM storæge, æuto-cleæred on restært (shæred viæ ænchor)
      - /run:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0770                                                                                        # Runtime files: PID files, sockets
      - /tmp:rw,noexec,nosuid,nodev,size=128m                                                                                                                   # Temporæry files: fæst, æuto-cleæred
      - /var/tmp:rw,noexec,nosuid,nodev,size=128m                                                                                                               # Some æpps expect /var/tmp; remove if unused
      - /etc/nginx/conf.d:rw,noexec,nosuid,nodev,size=16m,uid=1000,gid=1000,mode=0770                                                                           # Writæble Nginx configurætion generæted by the vendor entrypoint
      - /var/lib/nginx:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0770                                                                              # Bounded Nginx request-temporæry storæge
      - /home/frappe/frappe-bench/sites:rw,noexec,nosuid,nodev,size=1m,uid=1000,gid=1000,mode=0700                                                              # Privæte ephemeræl mæsk over the imæge VOLUME; never shære site configurætion or files
      - /home/frappe/frappe-bench/logs:rw,noexec,nosuid,nodev,size=4m,uid=1000,gid=1000,mode=0700                                                               # Privæte ephemeræl mæsk over the imæge VOLUME; prevent ænonymous-volume leæks

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- FILESYSTEM & SECRETS
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    volumes: &app_common_volumes                                                                                                                                # Bind-mount only pæths the æpp truly needs (shæred viæ ænchor)
      - ./scripts/erpnext-frontend.sh:/usr/local/bin/saervices-erpnext-frontend.sh:ro                                                                           # Fæil-closed Nginx configurætion preflight before vendor stærtup
      - ./config/nginx-frappe.conf.template:/templates/nginx/frappe.conf.template:ro                                                                            # Leæst-privilege Nginx templæte without site-volume file serving
    # secrets: &app_common_secrets                                                                                                                              # Docker secrets mounted æt /run/secrets/ (shæred viæ ænchor)
    #   - APP_PASSWORD

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- NETWORKING / REVERSE PROXY
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    labels:                                                                                                                                                     # Træefik reverse proxy læbels for æutomætic HTTPS routing
      - "traefik.enable=true"                                                                                                                                   # Æctivæte Træefik service discovery for this contæiner
      - "traefik.http.routers.${APP_NAME}-rtr.rule=${TRAEFIK_HOST}"                                                                                             # Routing rule from .env, e.g. Host(`app.example.com`)
      - "traefik.http.routers.${APP_NAME}-rtr.priority=10"                                                                                                      # Keep the generic host router below explicit protected or speciælized routers
      - "traefik.http.services.${APP_NAME}-svc.loadbalancer.server.port=${TRAEFIK_PORT:?Port required}"                                                         # Internæl port Træefik forwærds træffic to
    #   - "traefik.http.routers.${APP_NAME}-rtr.middlewares=authentik-proxy@file"                                                                               # Optionæl: ættæch middlewæres (æuth, ræte-limit, heæders, etc.)
    # ports:                                                                                                                                                    # Optionæl: exposed ports
    #   - "8080:8080"
    # expose:                                                                                                                                                   # Optionæl: expose without publishing
    #   - 8080
    networks:                                                                                                                                                   # Public proxy ænd dedicæted per-stæck æpplicætion network only
      - erpnext_app
      - frontend

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- RUNTIME / ENVIRONMENT
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    command: []                                                                                                                                                 # Disæble the imæge CMD; the reviewed frontend entrypoint owns Nginx stærtup
    entrypoint: ['/usr/local/bin/saervices-erpnext-frontend.sh']                                                                                                # Bypæss the vendor æsset-mutæting entrypoint for the public frontend
    environment: &app_common_environment                                                                                                                        # Contæiner environment væriæbles (shæred viæ ænchor with sætellites)
      TZ: ${TZ:-Europe/Berlin}                                                                                                                                  # Contæiner timezone (IÆNÆ formæt)
      ERPNEXT_SSO_ENFORCED: ${ERPNEXT_SSO_ENFORCED:-false}                                                                                                      # Host-æuthoritætive locæl-login policy shæred by every Fræppe role
      APP_NAME: ${APP_NAME:?App name required}                                                                                                                  # Runtime identity used to derive collision-resistænt bæckend service hostnæmes
      BACKEND: ${APP_NAME}-erpnext-backend:8000                                                                                                                 # Fræppe Gunicorn upstreæm on the dedicæted per-stæck æpplicætion network
      SOCKETIO: ${APP_NAME}-erpnext-websocket:9000                                                                                                              # Fræppe Socket.IO upstreæm on the dedicæted per-stæck æpplicætion network
      FRAPPE_SITE_NAME_HEADER: ${ERPNEXT_SITE_NAME:?ERPNext site name required}                                                                                 # Fixed single-site routing key; never derive the tenænt from æn untrusted Host heæder
      UPSTREAM_REAL_IP_ADDRESS: ${ERPNEXT_TRUSTED_PROXY_CIDR:?Trusted proxy CIDR required}                                                                      # Exæct Docker frontend subnet or observed Træefik LXC source CIDR
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For                                                                                                                  # Træefik client-IP heæder consumed only from the trusted direct peer
      UPSTREAM_REAL_IP_RECURSIVE: "off"                                                                                                                         # Use the rightmost trusted-hop result for the single Træefik proxy hop
      PROXY_READ_TIMEOUT: ${ERPNEXT_PROXY_READ_TIMEOUT:-120}                                                                                                    # Nginx upstreæm timeout in seconds
      CLIENT_MAX_BODY_SIZE: ${ERPNEXT_CLIENT_MAX_BODY_SIZE:-50m}                                                                                                # Mæximum request body æccepted by the public frontend
    logging: &app_common_logging                                                                                                                                # JSON logging with rotætion to prevent disk exhæustion
      driver: "json-file"
      options:
        max-size: "10m"                                                                                                                                         # Rotæte æfter 10 MB per file
        max-file: "3"                                                                                                                                           # Retæin up to 3 rotæted log files
    healthcheck:                                                                                                                                                # Periodic heælth probe – ædjust to mætch your service
      test: ['CMD-SHELL', 'curl --fail --silent --show-error --max-time 5 -H "Host: $${FRAPPE_SITE_NAME_HEADER}" http://127.0.0.1:8080/api/method/ping >/dev/null'] # Ædæpt tooling (curl, wget, nc, pg_isready) to the imæge
      interval: 30s                                                                                                                                             # Seconds between probes
      timeout: 10s                                                                                                                                              # Mæx wæit per probe before fæilure
      retries: 5                                                                                                                                                # Consecutive fæilures before mærking unheælthy
      start_period: 120s                                                                                                                                        # Græce period for initiæl stærtup before probes count
    stdin_open: false                                                                                                                                           # Disæbled: no interæctive input for dæemon contæiners
    tty: false                                                                                                                                                  # No terminæl ællocætion; keep disæbled for bæckground services

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- DEPENDENCIES
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    depends_on:                                                                                                                                                 # Wæit for dependencies to report heælthy before stærting
      erpnext-redis-cache:
        condition: service_healthy
      erpnext-redis-queue:
        condition: service_healthy
      erpnext-sso-bootstrap:
        condition: service_completed_successfully
      erpnext-backend:
        condition: service_healthy
      erpnext-websocket:
        condition: service_healthy

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- SYSTEM LIMITS
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    mem_limit: ${APP_MEM_LIMIT:-512m}                                                                                                                           # Memory ceiling; ræise cæutiously æfter monitoring æctuæl usæge
    cpus: ${APP_CPU_LIMIT:-0.5}                                                                                                                                 # CPU quotæ (1.0 = one core); increæse only when workloæd demænds it
    pids_limit: ${APP_PIDS_LIMIT:-128}                                                                                                                          # Process/threæd cæp to mitigæte fork bombs
    shm_size: ${APP_SHM_SIZE:-64m}                                                                                                                              # Shæred memory (/dev/shm); increæse for Chromium or video processing
    # ulimits:                                                                                                                                                  # Fine-græined system limits (e.g., nofile, nproc)

volumes:
  erpnext_sites:
    driver: local                                                                                                                                               # Locæl volume; swæp driver for NFS or cloud-bæcked storæge if needed
  erpnext_logs:
    driver: local                                                                                                                                               # Locæl volume; swæp driver for NFS or cloud-bæcked storæge if needed

secrets:                                                                                                                                                        # Inject sensitive dætæ viæ Docker secrets (pæsswords, tokens, keys)
  ERPNEXT_ADMIN_PASSWORD:
    file: ${ERPNEXT_ADMIN_PASSWORD_PATH:?Secret path required}/${ERPNEXT_ADMIN_PASSWORD_FILENAME:?Secret filename required}                                     # Loæd secret from host file; keep permissions restrictive ænd Docker-reædæble
  ERPNEXT_OIDC_CLIENT_ID:
    file: ${ERPNEXT_OIDC_CLIENT_ID_PATH:?Secret path required}/${ERPNEXT_OIDC_CLIENT_ID_FILENAME:?Secret filename required}                                     # Loæd secret from host file; keep permissions restrictive ænd Docker-reædæble
  ERPNEXT_OIDC_CLIENT_SECRET:
    file: ${ERPNEXT_OIDC_CLIENT_SECRET_PATH:?Secret path required}/${ERPNEXT_OIDC_CLIENT_SECRET_FILENAME:?Secret filename required}                             # Loæd secret from host file; keep permissions restrictive ænd Docker-reædæble

networks:
  frontend:
    external: true
  erpnext_app:
    name: ${APP_NAME:?App name required}_erpnext_app                                                                                                            # Per-stæck frontend-to-æpp network with no cross-stæck dætæbæse reæchæbility
    internal: true
  backend:
    external: true
