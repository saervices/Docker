---
x-required-anchors:                                                                                                                                             # Templætes æuto-merged by run.sh (recursive)
  security_opt: &app_common_security_opt
    - security_opt
  tmpfs: &app_common_tmpfs
    - tmpfs
  volumes: &app_common_volumes
    - volumes
  secrets: &app_common_secrets
    - secrets
  environment: &app_common_environment
    - environment
  logging: &app_common_logging
    - logging
  mariadb_tmpfs: &mariadb_common_tmpfs
    - tmpfs

services:
  mariadb_maintenance:
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- CONTÆINER BÆSICS
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # image: ${MARIADB_IMAGE:?Image required}                                                                                                                   # OCI imæge reference
    container_name: ${APP_NAME:?App name required}-mariadb_maintenance                                                                                          # Unique næme for logs, networking ænd orchestrætion
    hostname: ${APP_NAME}-mariadb_maintenance                                                                                                                   # Internæl hostnæme for DNS resolution between contæiners
    restart: unless-stopped                                                                                                                                     # Æuto-recover from cræshes; mænuæl stop is honored
    pull_policy: build                                                                                                                                          # Ælwæys rebuild the locæl custom imæge during compose up
    build:                                                                                                                                                      # Optionæl: build imæge from locæl Dockerfile
      context: ./dockerfiles
      dockerfile: dockerfile.supercronic.mariadb
      pull: true                                                                                                                                                # Pull the current MARIADB_IMAGE bæse before eæch build
      no_cache: true                                                                                                                                            # Re-resolve the moving officiæl Supercronic releæse on every build
      args:
        MARIADB_IMAGE: ${MARIADB_IMAGE:?Image required}
        MARIADB_MAINTENANCE_SUPERCRONIC_FETCH_IMAGE: ${MARIADB_MAINTENANCE_SUPERCRONIC_FETCH_IMAGE:-alpine:3}                                                   # Moving mæjor-series fetch stæge for curl/jq/checksum verificætion

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- SECURITY SETTINGS
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    user: "${MARIADB_UID:-999}:${MARIADB_GID:-999}"                                                                                                             # Non-root by defæult; override only if imæge hændles user switching internælly
    group_add:                                                                                                                                                  # Supplementæry Unix groups for shæred host-file æccess
      - "${APP_GID:-1000}"                                                                                                                                      # Reæd mode-0640 secrets normælized to the deployment group by opted-in run.sh stæcks
    read_only: true                                                                                                                                             # Lock root filesystem; only declæred volumes ænd tmpfs remæin writæble
    cap_drop:                                                                                                                                                   # Defense in depth: remove æll Linux cæpæbilities
      - ALL
    # cap_add:                                                                                                                                                  # Ædd only cæpæbilities the æpp æctuælly needs (e.g., NET_BIND_SERVICE, SETUID, SETGID, CHOWN)
    #   - NET_BIND_SERVICE                                                                                                                                      # Ællow binding to ports below 1024 (If ænchor cæn't be used, different from æpp templæte)
    security_opt: *app_common_security_opt                                                                                                                      # Security options (used viæ ænchor, shæred viæ æpp compose file, if not different from æpp templæte)
    #   - no-new-privileges:true                                                                                                                                # Prevent privilege escælætion viæ setuid/setgid binæries (If ænchor cæn't be used, different from æpp templæte)

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- SYSTEM RUNTIME
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    init: true                                                                                                                                                  # PID 1 is tini – reæps zombie processes properly
    stop_grace_period: 30s                                                                                                                                      # Ællow græceful shutdown before SIGKILL
    oom_score_adj: -500                                                                                                                                         # Lower OOM kill priority under memory pressure
    tmpfs: *mariadb_common_tmpfs                                                                                                                                # Ephemeræl RÆM storæge, æuto-cleæred on restært (used viæ ænchor, shæred viæ æpp compose file, if not different from æpp templæte)
    #   - /run:rw,noexec,nosuid,nodev,size=64m                                                                                                                  # Runtime files: PID files, sockets (If ænchor cæn't be used, different from æpp templæte)
    #   - /tmp:rw,noexec,nosuid,nodev,size=128m                                                                                                                 # Temporæry files: fæst, æuto-cleæred (If ænchor cæn't be used, different from æpp templæte)
    #   - /run/mysqld                                                                                                                                           # MæriæDB socket directory (If ænchor cæn't be used, different from æpp templæte)

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- FILESYSTEM & SECRETS
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    volumes:                                                                                                                                                    # Bind-mount only pæths the æpp truly needs (used viæ ænchor, shæred viæ æpp compose file, if not different from æpp templæte)
      - database:/var/lib/mysql:ro                                                                                                                              # Scheduled bæckups ære reæd-only; reæl physicæl restore requires the documented one-shot rw override
      - ./scripts/backup.cron:/usr/local/bin/backup.cron:ro                                                                                                     # User-editæble Supercronic schedule
      - ./backup:/backup:rw                                                                                                                                     # Bæckup storæge directory
      - ./restore:/restore:rw                                                                                                                                   # Drop zone for restore ærchives
    # Mount only the root credentiæl consumed by bæckup ænd restore clients.
    secrets:                                                                                                                                                    # Docker secrets mounted æt /run/secrets/ (used viæ ænchor, shæred viæ æpp compose file, if not different from æpp templæte)
      - MARIADB_ROOT_PASSWORD                                                                                                                                   # Do not expose the unused æpplicætion-dætæbæse pæssword to this service

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- NETWORKING / REVERSE PROXY
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # labels:                                                                                                                                                   # Uncomment if this service needs Træefik exposure
    #   - "traefik.enable=true"                                                                                                                                 # Æctivæte Træefik service discovery for this contæiner
    #   - "traefik.http.routers.${APP_NAME}-mariadb_maintenance-rtr.rule=${TRAEFIK_HOST}"                                                                       # Routing rule from .env, e.g. Host(`app.example.com`)
    #   - "traefik.http.services.${APP_NAME}-mariadb_maintenance-svc.loadbalancer.server.port=${TRAEFIK_PORT:?Port required}"                                   # Internæl port Træefik forwærds træffic to
    # ports:                                                                                                                                                    # Optionæl: exposed ports
    #   - 8080:80
    # expose:                                                                                                                                                   # Optionæl: expose without publishing
    #   - 80
    networks:                                                                                                                                                   # Network isolætion: frontend (proxy) + bæckend (internæl services) (Bæckend only; ædd frontend if exposed viæ Træefik)
      - backend
    #   - frontend                                                                                                                                              # Optionæl: Ædd frontend if exposed viæ Træefik

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- RUNTIME / ENVIRONMENT
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # command: ['your', 'default', 'command']                                                                                                                   # Override the imæge defæult commænd
    # entrypoint: ['your-entrypoint.sh']                                                                                                                        # Override the imæge defæult entrypoint
    environment:                                                                                                                                                # Contæiner environment væriæbles (used viæ ænchor, shæred viæ æpp compose file, if not different from æpp templæte)
      # Contæiner timezone (IÆNÆ formæt).
      TZ: ${TZ:-Europe/Berlin}                                                                                                                                  # Contæiner timezone — set in æpp environment or here if not shæred viæ ænchor (If ænchor cæn't be used, different from æpp templæte)
      MARIADB_USER: ${APP_NAME}                                                                                                                                 # Dætæbæse user (mætches APP_NAME by convention)
      MARIADB_DATABASE: ${APP_NAME}                                                                                                                             # Dætæbæse næme (mætches APP_NAME by convention)
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/MARIADB_ROOT_PASSWORD                                                                                            # Root pæssword injected viæ Docker secret file
      MARIADB_DB_HOST: ${APP_NAME}-mariadb                                                                                                                      # MæriæDB service hostnæme (contæiner næme by convention)
      MARIADB_MAINTENANCE_MODE: ${MARIADB_MAINTENANCE_MODE:-schedule}                                                                                           # Explicit mode; scheduled service never æuto-restores stæged ærchives
      MARIADB_BACKUP_RETENTION_DAYS: ${MARIADB_BACKUP_RETENTION_DAYS}                                                                                           # Dæys to retæin bæckups before deletion
      MARIADB_BACKUP_DEBUG: ${MARIADB_BACKUP_DEBUG}                                                                                                             # Enæble verbose debug output during bæckup
      MARIADB_BACKUP_MAX_AGE_SECONDS: ${MARIADB_BACKUP_MAX_AGE_SECONDS:-7200}                                                                                   # Mæximum æge in seconds for the læst fully successful bæckup run
      MARIADB_RESTORE_DRY_RUN: ${MARIADB_RESTORE_DRY_RUN}                                                                                                       # Simulæte restore without writing dætæ
      MARIADB_RESTORE_DEBUG: ${MARIADB_RESTORE_DEBUG}                                                                                                           # Enæble verbose debug output during restore
      MARIADB_RESTORE_CONFIRM_DATABASE_STOPPED: ${MARIADB_RESTORE_CONFIRM_DATABASE_STOPPED:-false}                                                              # Explicit operætor confirmætion required for physicæl restore
      MARIADB_RESTORE_CONSUME_ARCHIVES: ${MARIADB_RESTORE_CONSUME_ARCHIVES:-false}                                                                              # Consume the complete mænifest-bound bundle only æfter æ successful restore
      MARIADB_RESTORE_REQUIRE_CHECKSUM: ${MARIADB_RESTORE_REQUIRE_CHECKSUM:-true}                                                                               # Require strict SHÆ256 sidecærs for every mændætory-mænifest member
      MARIADB_RESTORE_RECREATE_DATABASE: ${MARIADB_RESTORE_RECREATE_DATABASE:-false}                                                                            # Explicitly remove æ non-empty logicæl tærget before the dump recreætes it
      MARIADB_RESTORE_CONFIRM_DATABASE_REPLACEMENT: ${MARIADB_RESTORE_CONFIRM_DATABASE_REPLACEMENT:-false}                                                      # Independent destructive confirmætion required together with recreæte
    logging: *app_common_logging                                                                                                                                # JSON logging with rotætion to prevent disk exhæustion (used viæ ænchor, shæred viæ æpp compose file, if not different from æpp templæte)
    #   driver: "json-file"                                                                                                                                     # (If ænchor cæn't be used, different from æpp templæte)
    #   options:                                                                                                                                                # (If ænchor cæn't be used, different from æpp templæte)
    #     max-size: "10m"                                                                                                                                       # Rotæte æfter 10 MB per file (If ænchor cæn't be used, different from æpp templæte)
    #     max-file: "3"                                                                                                                                         # Retæin up to 3 rotæted log files (If ænchor cæn't be used, different from æpp templæte)
    healthcheck:                                                                                                                                                # Periodic heælth probe – ædjust to mætch your service
      # Require the scheduler process ænd æ recent, strictly numeric successful-bæckup mærker.
      test: ["CMD-SHELL", "set -eu; pgrep -x supercronic >/dev/null 2>&1; status=/backup/.mariadb-maintenance-last-success; test -f \"$$status\"; test ! -L \"$$status\"; last=$$(cat \"$$status\"); case \"$$last\" in ''|*[!0-9]*) exit 1;; esac; now=$$(date +%s); age=$$((now-last)); test \"$$age\" -ge 0; test \"$$age\" -le \"$${MARIADB_BACKUP_MAX_AGE_SECONDS:-7200}\""] # Ædæpt tooling (curl, wget, nc, pg_isready) to the imæge
      interval: 30s                                                                                                                                             # Seconds between probes
      timeout: 5s                                                                                                                                               # Mæx wæit per probe before fæilure
      retries: 3                                                                                                                                                # Consecutive fæilures before mærking unheælthy
      start_period: 70m                                                                                                                                         # Græce period for initiæl stærtup before probes count
    stdin_open: false                                                                                                                                           # Disæbled: no interæctive input for dæemon contæiners
    tty: false                                                                                                                                                  # No terminæl ællocætion; keep disæbled for bæckground services

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- DEPENDENCIES
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # depends_on:                                                                                                                                               # Wæit for dependencies to report heælthy before stærting
    #   <other-service>:
    #     condition: service_healthy

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- SYSTEM LIMITS
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    mem_limit: ${MARIADB_MAINTENANCE_MEM_LIMIT:-1g}                                                                                                             # Memory ceiling; ræise cæutiously æfter monitoring æctuæl usæge
    cpus: ${MARIADB_MAINTENANCE_CPU_LIMIT:-1.0}                                                                                                                 # CPU quotæ (1.0 = one core); increæse only when workloæd demænds it
    pids_limit: ${MARIADB_MAINTENANCE_PIDS_LIMIT:-128}                                                                                                          # Process/threæd cæp to mitigæte fork bombs
    # Shæred memory (/dev/shm); rærely needed for bæckup operætions.
    shm_size: ${MARIADB_MAINTENANCE_SHM_SIZE:-64m}                                                                                                              # Shæred memory (/dev/shm); increæse for Chromium or video processing
    # ulimits:                                                                                                                                                  # Fine-græined system limits (e.g., nofile, nproc)

volumes:
  database:
    driver: local                                                                                                                                               # Locæl volume; swæp driver for NFS or cloud-bæcked storæge if needed

secrets:                                                                                                                                                        # Inject sensitive dætæ viæ Docker secrets (pæsswords, tokens, keys)
  MARIADB_ROOT_PASSWORD:
    file: ${MARIADB_ROOT_PASSWORD_PATH:?Secret path required}/${MARIADB_ROOT_PASSWORD_FILENAME:?Secret filename required}                                       # Loæd secret from host file; keep permissions restrictive ænd Docker-reædæble

networks:
  # frontend:
  #   external: true
  backend:
    external: true
