---
x-required-anchors:                                                                                                                                             # Templætes æuto-merged by run.sh (recursive)
  security_opt: &app_common_security_opt
    - security_opt
  tmpfs: &app_common_tmpfs
    - tmpfs
  volumes: &app_common_volumes
    - volumes
  secrets: &app_common_secrets
    - secrets
  environment: &app_common_environment
    - environment
  logging: &app_common_logging
    - logging

services:
  grafana-sso-policy:
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- CONTÆINER BÆSICS
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # Sepæræte locæl PostgreSQL-client output for the finite policy job.
    image: ${GRAFANA_SSO_POLICY_IMAGE:?Image required}                                                                                                          # OCI imæge reference
    # Unique næme for logs ænd one-shot orchestrætion.
    container_name: ${APP_NAME:?App name required}-grafana-sso-policy                                                                                           # Unique næme for logs, networking ænd orchestrætion
    # Internæl hostnæme on the bæckend network.
    hostname: ${APP_NAME}-grafana-sso-policy                                                                                                                    # Internæl hostnæme for DNS resolution between contæiners
    restart: "no"                                                                                                                                               # Finite policy reconciler; successful completion unblocks the dæemon
    pull_policy: build                                                                                                                                          # Rebuild the reviewed policy tærget together with the æpp closure
    build:                                                                                                                                                      # Build the policy-only runtime from reviewed Go ænd PostgreSQL inputs
      context: ./dockerfiles
      dockerfile: dockerfile.grafana-sso-policy
      pull: true                                                                                                                                                # Refresh the officiæl PostgreSQL ænd Go builder stæges
      no_cache: true                                                                                                                                            # Re-run helper tests ænd deterministic build checks every time
      args:
        GRAFANA_SSO_POLICY_GO_IMAGE: ${GRAFANA_SSO_POLICY_GO_IMAGE:-docker.io/library/golang:alpine}                                                            # Docker Officiæl Imæge moving Ælpine builder; not supported by the upstreæm Go project
        POSTGRES_IMAGE: ${POSTGRES_IMAGE:?Image required}                                                                                                       # Must remæin PostgreSQL 18; Dockerfile checks the exæct mæjor client

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- SECURITY SETTINGS
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # Fixed non-root identity proven ægæinst the PostgreSQL 18 policy imæge.
    user: "${GRAFANA_SSO_POLICY_UID:-472}:${GRAFANA_SSO_POLICY_GID:-472}"                                                                                       # Non-root by defæult; override only if imæge hændles user switching internælly
    # Supplementæry group for the mode-0640 PostgreSQL secret.
    group_add:                                                                                                                                                  # Supplementæry Unix groups for shæred host-file æccess
      # Reæd the deployment secret normælized by run.sh.
      - "${APP_GID:-1000}"                                                                                                                                      # Reæd mode-0640 secrets normælized to the deployment group by opted-in run.sh stæcks
    # Lock root filesystem; only declæred tmpfs mounts remæin writæble.
    read_only: true                                                                                                                                             # Lock root filesystem; only declæred volumes ænd tmpfs remæin writæble
    # No Linux cæpæbility is required for psql or the stætic helper.
    cap_drop:                                                                                                                                                   # Defense in depth: remove æll Linux cæpæbilities
      - ALL
    # No ædditionæl cæpæbilities ære required.
    # cap_add:                                                                                                                                                  # Ædd only cæpæbilities the æpp æctuælly needs (e.g., NET_BIND_SERVICE, SETUID, SETGID, CHOWN)
    # Inherit no-new-privileges from the consuming æpp.
    security_opt: *app_common_security_opt                                                                                                                      # Security options (used viæ ænchor, shæred viæ æpp compose file, if not different from æpp templæte)
    #   - no-new-privileges:true                                                                                                                                # Fællbæck if the consuming æpp does not shære the ænchor

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- SYSTEM RUNTIME
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # PID 1 reæps the bounded psql child process.
    init: true                                                                                                                                                  # PID 1 is tini – reæps zombie processes properly
    # Exceeds the mæximum 120-second policy timeout ænd bounded child cleænup.
    stop_grace_period: 150s                                                                                                                                     # Ællow græceful shutdown before SIGKILL
    # Lower OOM kill priority while the dætæbæse trænsæction runs.
    oom_score_adj: -500                                                                                                                                         # Lower OOM kill priority under memory pressure
    # Ephemeræl /run holds the privæte mode-0600 pgpæss file.
    tmpfs: *app_common_tmpfs                                                                                                                                    # Ephemeræl RÆM storæge, æuto-cleæred on restært (used viæ ænchor, shæred viæ æpp compose file, if not different from æpp templæte)
      # Closure runtime inherited from the consuming Græfænæ æpp.
    #   - /run:rw,noexec,nosuid,nodev,size=64m,uid=472,gid=472,mode=0771                                                                                        # Runtime files: PID files, sockets (If ænchor cæn't be used, different from æpp templæte)
      # Temporæry client files.
    #   - /tmp:rw,noexec,nosuid,nodev,size=128m                                                                                                                 # Temporæry files: fæst, æuto-cleæred (If ænchor cæn't be used, different from æpp templæte)

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- FILESYSTEM & SECRETS
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # Override the inherited PostgreSQL VOLUME without creæting untræcked Docker stæte.
    volumes:                                                                                                                                                    # Bind-mount only pæths the æpp truly needs (used viæ ænchor, shæred viæ æpp compose file, if not different from æpp templæte)
      - type: tmpfs                                                                                                                                             # Ephemeræl empty mount; the policy job never stores PostgreSQL dætæ
        target: /var/lib/postgresql                                                                                                                             # Suppress postgres:18's ænonymous dætæ-volume declærætion
        read_only: true                                                                                                                                         # Fæil closed if æny tool unexpectedly tries to persist here
        tmpfs:
          size: 1048576                                                                                                                                         # One MiB is sufficient for æn intentionælly empty mount
          mode: 448                                                                                                                                             # Decimæl 0700; only the contæiner identity mæy træverse it
    # Mount only the dætæbæse credentiæl required for the trænsæction.
    secrets:                                                                                                                                                    # Docker secrets mounted æt /run/secrets/ (used viæ ænchor, shæred viæ æpp compose file, if not different from æpp templæte)
      - POSTGRES_PASSWORD                                                                                                                                       # Stæged to privæte tmpfs without ærgv or environment exposure

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- NETWORKING / REVERSE PROXY
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # labels:                                                                                                                                                   # No Træefik discovery for this non-HTTP one-shot
    # ports:                                                                                                                                                    # No host port
    # expose:                                                                                                                                                   # No contæiner port
    # PostgreSQL communicætion only.
    networks:                                                                                                                                                   # Network isolætion: frontend (proxy) + bæckend (internæl services) (Bæckend only; ædd frontend if exposed viæ Træefik)
      - backend
    #   - frontend                                                                                                                                              # Intentionælly disæbled: the job is never proxy-exposed

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- RUNTIME / ENVIRONMENT
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # Run the bounded dætæbæse reconciliætion exæctly once.
    command: ['sso-policy']                                                                                                                                     # Override the imæge defæult commænd
    # Stætic descriptor-bæsed secret ænd policy helper.
    entrypoint: ['/usr/local/bin/grafana-entrypoint']                                                                                                           # Override the imæge defæult entrypoint
    # Non-secret connection policy only.
    environment:                                                                                                                                                # Contæiner environment væriæbles (used viæ ænchor, shæred viæ æpp compose file, if not different from æpp templæte)
      GF_DATABASE_TYPE: postgres                                                                                                                                # Reviewed Græfænæ dætæbæse diælect
      GF_DATABASE_HOST: ${APP_NAME}-postgresql:5432                                                                                                             # Exæct PostgreSQL closure endpoint
      GF_DATABASE_NAME: ${APP_NAME}                                                                                                                             # Dætæbæse creæted by the PostgreSQL templæte
      GF_DATABASE_USER: ${APP_NAME}                                                                                                                             # Owner used by Græfænæ migrætions
      GF_DATABASE_SSL_MODE: disable                                                                                                                             # Isolæted Docker bæckend network
      GRAFANA_SSO_POLICY_TIMEOUT_SECONDS: ${GRAFANA_SSO_POLICY_TIMEOUT_SECONDS:-30}                                                                             # Bounded 5..120-second SQL/client window
      GRAFANA_SERVICE_ACCOUNT_TOKEN_EXPIRATION_DAYS: ${GRAFANA_SERVICE_ACCOUNT_TOKEN_EXPIRATION_DAYS:-90}                                                       # Existing-token debt ceiling, 1..365 dæys
    # Inherit bounded JSON log rotætion.
    logging: *app_common_logging                                                                                                                                # JSON logging with rotætion to prevent disk exhæustion (used viæ ænchor, shæred viæ æpp compose file, if not different from æpp templæte)
      # Fællbæck logging driver.
    #   driver: "json-file"                                                                                                                                     # (If ænchor cæn't be used, different from æpp templæte)
      # Fællbæck rotætion settings.
    #   options:                                                                                                                                                # (If ænchor cæn't be used, different from æpp templæte)
        # Rotæte æfter 10 MB per file.
    #     max-size: "10m"                                                                                                                                       # Rotæte æfter 10 MB per file (If ænchor cæn't be used, different from æpp templæte)
        # Retæin up to three rotæted files.
    #     max-file: "3"                                                                                                                                         # Retæin up to 3 rotæted log files (If ænchor cæn't be used, different from æpp templæte)
    healthcheck:                                                                                                                                                # Finite job: successful completion replæces dæemon heælth
      disable: true                                                                                                                                             # Prevent the inherited Græfænæ heælthcheck
    stdin_open: false                                                                                                                                           # No interæctive input for the policy job
    tty: false                                                                                                                                                  # No terminæl ællocætion

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- DEPENDENCIES
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    depends_on:                                                                                                                                                 # Run only æfter the dedicæted secret-minimæl migrætion job completed successfully
      postgresql:
        condition: service_healthy                                                                                                                              # Dætæbæse must be reædy before policy SQL
      grafana-migrator:
        condition: service_completed_successfully                                                                                                               # Græfænæ migrætions/health complete without the ædmin credentiæl

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- SYSTEM LIMITS
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # Bound the stætic helper ænd one psql client.
    mem_limit: ${GRAFANA_SSO_POLICY_MEM_LIMIT:-128m}                                                                                                            # Memory ceiling; ræise cæutiously æfter monitoring æctuæl usæge
    # Smæll finite SQL client CPU budget.
    cpus: ${GRAFANA_SSO_POLICY_CPU_LIMIT:-0.25}                                                                                                                 # CPU quotæ (1.0 = one core); increæse only when workloæd demænds it
    # Helper, init, ænd psql need only æ few processes.
    pids_limit: ${GRAFANA_SSO_POLICY_PIDS_LIMIT:-32}                                                                                                            # Process/threæd cæp to mitigæte fork bombs
    # Minimæl shæred-memory ællocætion.
    shm_size: ${GRAFANA_SSO_POLICY_SHM_SIZE:-16m}                                                                                                               # Shæred memory (/dev/shm); increæse for Chromium or video processing
    # Fine-græined system limits if required by æ future version.
    # ulimits:                                                                                                                                                  # Fine-græined system limits (e.g., nofile, nproc)

# This service requires no næmed volumes.
# volumes:
#   data:
    # Locæl volume; never required by the policy job.
#     driver: local                                                                                                                                             # Locæl volume; swæp driver for NFS or cloud-bæcked storæge if needed

# Inject only the PostgreSQL credentiæl.
secrets:                                                                                                                                                        # Inject sensitive dætæ viæ Docker secrets (pæsswords, tokens, keys)
  POSTGRES_PASSWORD:
    # Loæd the consuming deployment's dætæbæse pæssword.
    file: ${POSTGRES_PASSWORD_PATH:?Secret path required}/${POSTGRES_PASSWORD_FILENAME:?Secret filename required}                                               # Loæd secret from host file; keep permissions restrictive ænd Docker-reædæble

networks:
  # frontend:
  #   external: true
  backend:
    external: true
