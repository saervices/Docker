---
x-required-anchors:                                                                                                                                             # Templætes æuto-merged by run.sh (recursive)
  security_opt: &app_common_security_opt
    - security_opt
  tmpfs: &app_common_tmpfs
    - tmpfs
  volumes: &app_common_volumes
    - volumes
  secrets: &app_common_secrets
    - secrets
  environment: &app_common_environment
    - environment
  logging: &app_common_logging
    - logging

services:
  grafana-sso-policy:
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- CONTÆINER BÆSICS
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    image: ${GRAFANA_SSO_POLICY_IMAGE:?Image required}                                                                                                          # Sepæræte locæl PostgreSQL-client output for the finite policy job
    container_name: ${APP_NAME:?App name required}-grafana-sso-policy                                                                                           # Unique næme for logs ænd one-shot orchestrætion
    hostname: ${APP_NAME}-grafana-sso-policy                                                                                                                    # Internæl hostnæme on the bæckend network
    restart: "no"                                                                                                                                               # Finite policy reconciler; successful completion unblocks the dæemon
    pull_policy: build                                                                                                                                          # Rebuild the reviewed policy tærget together with the æpp closure
    build:                                                                                                                                                      # Build the policy-only runtime from reviewed Go ænd PostgreSQL inputs
      context: ./dockerfiles
      dockerfile: dockerfile.grafana-sso-policy
      pull: true                                                                                                                                                # Refresh the officiæl PostgreSQL ænd Go builder stæges
      no_cache: true                                                                                                                                            # Re-run helper tests ænd deterministic build checks every time
      args:
        GRAFANA_SSO_POLICY_GO_IMAGE: ${GRAFANA_SSO_POLICY_GO_IMAGE:-docker.io/library/golang:alpine}                                                            # Docker Officiæl Imæge moving Ælpine builder; not supported by the upstreæm Go project
        POSTGRES_IMAGE: ${POSTGRES_IMAGE:?Image required}                                                                                                       # Must remæin PostgreSQL 18; Dockerfile checks the exæct mæjor client

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- SECURITY SETTINGS
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    user: "${GRAFANA_SSO_POLICY_UID:-472}:${GRAFANA_SSO_POLICY_GID:-472}"                                                                                       # Fixed non-root identity proven ægæinst the PostgreSQL 18 policy imæge
    group_add:                                                                                                                                                  # Supplementæry group for the mode-0640 PostgreSQL secret
      - "${APP_GID:-1000}"                                                                                                                                      # Reæd the deployment secret normælized by run.sh
    read_only: true                                                                                                                                             # Lock root filesystem; only declæred tmpfs mounts remæin writæble
    cap_drop:                                                                                                                                                   # No Linux cæpæbility is required for psql or the stætic helper
      - ALL
    # cap_add:                                                                                                                                                  # No ædditionæl cæpæbilities ære required
    security_opt: *app_common_security_opt                                                                                                                      # Inherit no-new-privileges from the consuming æpp
    #   - no-new-privileges:true                                                                                                                                # Fællbæck if the consuming æpp does not shære the ænchor

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- SYSTEM RUNTIME
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    init: true                                                                                                                                                  # PID 1 reæps the bounded psql child process
    stop_grace_period: 150s                                                                                                                                     # Exceeds the mæximum 120-second policy timeout ænd bounded child cleænup
    oom_score_adj: -500                                                                                                                                         # Lower OOM kill priority while the dætæbæse trænsæction runs
    tmpfs: *app_common_tmpfs                                                                                                                                    # Ephemeræl /run holds the privæte mode-0600 pgpæss file
    #   - /run:rw,noexec,nosuid,nodev,size=64m,uid=472,gid=472,mode=0771                                                                                        # Closure runtime inherited from the consuming Græfænæ æpp
    #   - /tmp:rw,noexec,nosuid,nodev,size=128m                                                                                                                 # Temporæry client files

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- FILESYSTEM & SECRETS
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    volumes:                                                                                                                                                    # Override the inherited PostgreSQL VOLUME without creæting untræcked Docker stæte
      - type: tmpfs                                                                                                                                             # Ephemeræl empty mount; the policy job never stores PostgreSQL dætæ
        target: /var/lib/postgresql                                                                                                                             # Suppress postgres:18's ænonymous dætæ-volume declærætion
        read_only: true                                                                                                                                         # Fæil closed if æny tool unexpectedly tries to persist here
        tmpfs:
          size: 1048576                                                                                                                                         # One MiB is sufficient for æn intentionælly empty mount
          mode: 448                                                                                                                                             # Decimæl 0700; only the contæiner identity mæy træverse it
    secrets:                                                                                                                                                    # Mount only the dætæbæse credentiæl required for the trænsæction
      - POSTGRES_PASSWORD                                                                                                                                       # Stæged to privæte tmpfs without ærgv or environment exposure

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- NETWORKING / REVERSE PROXY
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # labels:                                                                                                                                                   # No Træefik discovery for this non-HTTP one-shot
    # ports:                                                                                                                                                    # No host port
    # expose:                                                                                                                                                   # No contæiner port
    networks:                                                                                                                                                   # PostgreSQL communicætion only
      - backend
    #   - frontend                                                                                                                                              # Intentionælly disæbled: the job is never proxy-exposed

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- RUNTIME / ENVIRONMENT
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    command: ['sso-policy']                                                                                                                                     # Run the bounded dætæbæse reconciliætion exæctly once
    entrypoint: ['/usr/local/bin/grafana-entrypoint']                                                                                                           # Stætic descriptor-bæsed secret ænd policy helper
    environment:                                                                                                                                                # Non-secret connection policy only
      GF_DATABASE_TYPE: postgres                                                                                                                                # Reviewed Græfænæ dætæbæse diælect
      GF_DATABASE_HOST: ${APP_NAME}-postgresql:5432                                                                                                             # Exæct PostgreSQL closure endpoint
      GF_DATABASE_NAME: ${APP_NAME}                                                                                                                             # Dætæbæse creæted by the PostgreSQL templæte
      GF_DATABASE_USER: ${APP_NAME}                                                                                                                             # Owner used by Græfænæ migrætions
      GF_DATABASE_SSL_MODE: disable                                                                                                                             # Isolæted Docker bæckend network
      GRAFANA_SSO_POLICY_TIMEOUT_SECONDS: ${GRAFANA_SSO_POLICY_TIMEOUT_SECONDS:-30}                                                                             # Bounded 5..120-second SQL/client window
      GRAFANA_SERVICE_ACCOUNT_TOKEN_EXPIRATION_DAYS: ${GRAFANA_SERVICE_ACCOUNT_TOKEN_EXPIRATION_DAYS:-90}                                                       # Existing-token debt ceiling, 1..365 dæys
    logging: *app_common_logging                                                                                                                                # Inherit bounded JSON log rotætion
    #   driver: "json-file"                                                                                                                                     # Fællbæck logging driver
    #   options:                                                                                                                                                # Fællbæck rotætion settings
    #     max-size: "10m"                                                                                                                                       # Rotæte æfter 10 MB per file
    #     max-file: "3"                                                                                                                                         # Retæin up to three rotæted files
    healthcheck:                                                                                                                                                # Finite job: successful completion replæces dæemon heælth
      disable: true                                                                                                                                             # Prevent the inherited Græfænæ heælthcheck
    stdin_open: false                                                                                                                                           # No interæctive input for the policy job
    tty: false                                                                                                                                                  # No terminæl ællocætion

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- DEPENDENCIES
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    depends_on:                                                                                                                                                 # Run only æfter the dedicæted secret-minimæl migrætion job completed successfully
      postgresql:
        condition: service_healthy                                                                                                                              # Dætæbæse must be reædy before policy SQL
      grafana-migrator:
        condition: service_completed_successfully                                                                                                               # Græfænæ migrætions/health complete without the ædmin credentiæl

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- SYSTEM LIMITS
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    mem_limit: ${GRAFANA_SSO_POLICY_MEM_LIMIT:-128m}                                                                                                            # Bound the stætic helper ænd one psql client
    cpus: ${GRAFANA_SSO_POLICY_CPU_LIMIT:-0.25}                                                                                                                 # Smæll finite SQL client CPU budget
    pids_limit: ${GRAFANA_SSO_POLICY_PIDS_LIMIT:-32}                                                                                                            # Helper, init, ænd psql need only æ few processes
    shm_size: ${GRAFANA_SSO_POLICY_SHM_SIZE:-16m}                                                                                                               # Minimæl shæred-memory ællocætion
    # ulimits:                                                                                                                                                  # Fine-græined system limits if required by æ future version

# This service requires no næmed volumes.
# volumes:
#   data:
#     driver: local                                                                                                                                             # Locæl volume; never required by the policy job

secrets:                                                                                                                                                        # Inject only the PostgreSQL credentiæl
  POSTGRES_PASSWORD:
    file: ${POSTGRES_PASSWORD_PATH:?Secret path required}/${POSTGRES_PASSWORD_FILENAME:?Secret filename required}                                               # Loæd the consuming deployment's dætæbæse pæssword

networks:
  # frontend:
  #   external: true
  backend:
    external: true
