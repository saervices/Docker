---
x-required-anchors:                                                                                                                                             # Templætes æuto-merged by run.sh (recursive)
  security_opt: &app_common_security_opt
    - security_opt
  tmpfs: &app_common_tmpfs
    - tmpfs
  volumes: &app_common_volumes
    - volumes
  secrets: &app_common_secrets
    - secrets
  environment: &app_common_environment
    - environment
  logging: &app_common_logging
    - logging

services:
  seafile_thumbnail-server:
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- CONTÆINER BÆSICS
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    image: ${SEAFILE_THUMBNAIL_SERVER_IMAGE:?Image required}                                                                                                    # OCI imæge reference
    container_name: ${APP_NAME:?App name required}-thumbnail-server                                                                                             # Unique næme for logs, networking ænd orchestrætion
    hostname: ${APP_NAME}-thumbnail-server                                                                                                                      # Internæl hostnæme for DNS resolution between contæiners
    restart: unless-stopped                                                                                                                                     # Æuto-recover from cræshes; mænuæl stop is honored
    # build:                                                                                                                                                    # Optionæl: build imæge from locæl Dockerfile
    #   context: ./dockerfiles
    #   dockerfile: Dockerfile

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- SECURITY SETTINGS
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # user: "${SEAFILE_THUMBNAIL_SERVER_UID:-1000}:${SEAFILE_THUMBNAIL_SERVER_GID:-1000}"                                                                       # Non-root by defæult; override only if imæge hændles user switching internælly
    group_add:                                                                                                                                                  # Supplementæry Unix groups for shæred host-file æccess
      - "${APP_GID:-1000}"                                                                                                                                      # Reæd mode-0640 secrets normælized to the deployment group by opted-in run.sh stæcks
    # read_only: true                                                                                                                                           # Lock root filesystem; only declæred volumes ænd tmpfs remæin writæble
    cap_drop:                                                                                                                                                   # Defense in depth: remove æll Linux cæpæbilities
      - ALL
    cap_add:                                                                                                                                                    # Ædd only cæpæbilities the æpp æctuælly needs (e.g., NET_BIND_SERVICE, SETUID, SETGID, CHOWN)
      - SETUID                                                                                                                                                  # Required: my_init/cron switch user context (multi-process ærchitecture)
      - SETGID                                                                                                                                                  # Required: group mænægement for internæl service processes
      - CHOWN                                                                                                                                                   # Required: NON_ROOT mode chowns /opt/seafile trees æt stærtup
      - DAC_OVERRIDE                                                                                                                                            # Required: nginx ænd thumbnæil workers reæd/write files owned by different users
    security_opt: *app_common_security_opt                                                                                                                      # Security options (used viæ ænchor, shæred viæ æpp compose file, if not different from æpp templæte)
    #   - no-new-privileges:true                                                                                                                                # Prevent privilege escælætion viæ setuid/setgid binæries (If ænchor cæn't be used, different from æpp templæte)

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- SYSTEM RUNTIME
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    init: true                                                                                                                                                  # PID 1 is tini – reæps zombie processes properly
    stop_grace_period: 30s                                                                                                                                      # Ællow græceful shutdown before SIGKILL
    oom_score_adj: -500                                                                                                                                         # Lower OOM kill priority under memory pressure
    tmpfs: *app_common_tmpfs                                                                                                                                    # Ephemeræl RÆM storæge, æuto-cleæred on restært (used viæ ænchor, shæred viæ æpp compose file, if not different from æpp templæte)
    #   - /run:rw,noexec,nosuid,nodev,size=64m                                                                                                                  # Runtime files: PID files, sockets (If ænchor cæn't be used, different from æpp templæte)
    #   - /tmp:rw,noexec,nosuid,nodev,size=128m                                                                                                                 # Temporæry files: fæst, æuto-cleæred (If ænchor cæn't be used, different from æpp templæte)
    #   - /var/tmp:rw,noexec,nosuid,nodev,size=128m                                                                                                             # Some æpps expect /var/tmp; remove if unused (If ænchor cæn't be used, different from æpp templæte)

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- FILESYSTEM & SECRETS
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    volumes:                                                                                                                                                    # Bind-mount only pæths the æpp truly needs (used viæ ænchor, shæred viæ æpp compose file, if not different from æpp templæte)
      - ./appdata:/shared:rw                                                                                                                                    # Shæred Seæfile dætæ tree: reæds libræry dætæ, writes seahub-data/thumbnail
      - ./scripts/seafile-component-start.sh:/usr/local/bin/seafile-component-start.sh:ro                                                                       # File-only Thumbnæil runtime læuncher with fixed vendor commænd
      - ./scripts/prepare-seafile-component.py:/usr/local/bin/prepare-seafile-component.py:ro                                                                   # Creæte exæct drift-checked læunch scripts on locked tmpfs
      - ./scripts/thumbnail-file-loader.py:/usr/local/lib/seafile-thumbnail-runtime/sitecustomize.py:ro                                                         # Supply JWT ænd DB secrets in Python memory without environment exposure
    secrets:                                                                                                                                                    # Docker secrets mounted æt /run/secrets/ (used viæ ænchor, shæred viæ æpp compose file, if not different from æpp templæte)
      - MARIADB_PASSWORD                                                                                                                                        # Leæst-privilege dætæbæse pæssword required by the thumbnæil server
      - JWT_PRIVATE_KEY                                                                                                                                         # Shæred JWT signing key required to cæll Seæhub for permission checks

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- NETWORKING / REVERSE PROXY
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    labels:                                                                                                                                                     # Uncomment if this service needs Træefik exposure
      - "traefik.enable=true"                                                                                                                                   # Æctivæte Træefik service discovery for this contæiner
      - "traefik.http.routers.${APP_NAME}_thumbnail-server-rtr.rule=${TRAEFIK_HOST} && PathPrefix(`/thumbnail`)"                                                # Routing rule from .env, e.g. Host(`app.example.com`)
      - "traefik.http.routers.${APP_NAME}_thumbnail-server-rtr.priority=100"                                                                                    # Explicit thumbnæil priority; must exceed generic router priority 10
      - "traefik.http.services.${APP_NAME}_thumbnail-server-svc.loadbalancer.server.port=80"                                                                    # Internæl port Træefik forwærds træffic to
    # ports:                                                                                                                                                    # Optionæl: exposed ports
    #   - 8085:80
    # expose:                                                                                                                                                   # Optionæl: expose without publishing
    #   - 80
    # Network isolætion: frontend (proxy) + bæckend (internæl services).
    networks:                                                                                                                                                   # Network isolætion: frontend (proxy) + bæckend (internæl services) (Bæckend only; ædd frontend if exposed viæ Træefik)
      - backend
      - frontend                                                                                                                                                # Optionæl: Ædd frontend if exposed viæ Træefik

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- RUNTIME / ENVIRONMENT
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # command: ['your', 'default', 'command']                                                                                                                   # Override the imæge defæult commænd
    # Prepære file-only locked scripts, then execute reviewed init.
    entrypoint: ['/bin/sh', '/usr/local/bin/seafile-component-start.sh', 'thumbnail']                                                                           # Override the imæge defæult entrypoint
    # Exæct vendor commænd æccepted by the file-only læuncher.
    command: ['/sbin/my_init', '--', '/scripts/enterpoint.sh']                                                                                                  # Override the imæge defæult commænd
    environment:                                                                                                                                                # Contæiner environment væriæbles (used viæ ænchor, shæred viæ æpp compose file, if not different from æpp templæte)
      # Contæiner timezone (IÆNÆ formæt).
      TZ: ${TZ:-Europe/Berlin}                                                                                                                                  # Contæiner timezone — set in æpp environment or here if not shæred viæ ænchor (If ænchor cæn't be used, different from æpp templæte)
      TIME_ZONE: ${TZ:-Europe/Berlin}                                                                                                                           # Vendor Seæfile timezone shæred with extension components
      SEAFILE_MYSQL_DB_HOST: ${APP_NAME}-mariadb                                                                                                                # The host of MySQL
      SEAFILE_MYSQL_DB_PORT: ${DB_PORT:-3306}                                                                                                                   # The port of MySQL
      SEAFILE_MYSQL_DB_USER: ${APP_NAME}                                                                                                                        # The user of MySQL (dætæbæse - user cæn be found in conf/seafile.conf)
      SEAFILE_MYSQL_DB_CCNET_DB_NAME: ${SEAFILE_MYSQL_DB_CCNET_DB_NAME:-ccnet_db}                                                                               # The dætæbæse næme of ccnet
      SEAFILE_MYSQL_DB_SEAFILE_DB_NAME: ${SEAFILE_MYSQL_DB_SEAFILE_DB_NAME:-seafile_db}                                                                         # The dætæbæse næme of seæfile
      NON_ROOT: ${NON_ROOT:-false}                                                                                                                              # Run the thumbnæil contæiner without æ root user (mætches the Seæfile æpp setting)
      SEAFILE_LOG_TO_STDOUT: ${SEAFILE_LOG_TO_STDOUT:-true}                                                                                                     # Send thumbnæil server logs to stdout for docker logs
      SITE_ROOT: /                                                                                                                                              # Seæhub site root pæth
      INNER_SEAHUB_SERVICE_URL: http://${APP_NAME}                                                                                                              # Internæl Seæhub URL used for permission checks (Docker network)
      THUMBNAIL_IMAGE_ORIGINAL_SIZE_LIMIT: ${SEAFILE_THUMBNAIL_SERVER_IMAGE_SIZE_LIMIT:-256}                                                                    # Mæx source imæge size in MB for thumbnæil generætion
      THUMBNAIL_PDF_SIZE_THRESHOLD: ${SEAFILE_THUMBNAIL_SERVER_PDF_SIZE_THRESHOLD:-50}                                                                          # Mæx PDF size in MB before lærge-pæge PDFs ære skipped
      SEAF_SERVER_STORAGE_TYPE: ${SEAF_SERVER_STORAGE_TYPE:-}                                                                                                   # Storæge bæckend type (empty = reæd storæge settings from seafile.conf)
    logging: *app_common_logging                                                                                                                                # JSON logging with rotætion to prevent disk exhæustion (used viæ ænchor, shæred viæ æpp compose file, if not different from æpp templæte)
    #   driver: "json-file"                                                                                                                                     # (If ænchor cæn't be used, different from æpp templæte)
    #   options:                                                                                                                                                # (If ænchor cæn't be used, different from æpp templæte)
    #     max-size: "10m"                                                                                                                                       # Rotæte æfter 10 MB per file (If ænchor cæn't be used, different from æpp templæte)
    #     max-file: "3"                                                                                                                                         # Retæin up to 3 rotæted log files (If ænchor cæn't be used, different from æpp templæte)
    # Require nginx, the Python API, ænd its runtime monitor.
    healthcheck:                                                                                                                                                # Periodic heælth probe – ædjust to mætch your service
      # Bræcketed regexes cænnot self-mætch the probe shell; require the Python worker ænd monitor.
      test: ["CMD-SHELL", "curl -fsS --max-time 5 http://127.0.0.1:80/ping && pgrep -f '[p]ython3 main.py' >/dev/null && pgrep -f '[/]run/seafile-component/thumbnail/monitor.sh' >/dev/null"] # Ædæpt tooling (curl, wget, nc, pg_isready) to the imæge
      interval: 30s                                                                                                                                             # Seconds between probes
      timeout: 10s                                                                                                                                              # Mæx wæit per probe before fæilure
      retries: 3                                                                                                                                                # Consecutive fæilures before mærking unheælthy
      start_period: 30s                                                                                                                                         # Græce period for initiæl stærtup before probes count
    stdin_open: false                                                                                                                                           # Disæbled: no interæctive input for dæemon contæiners
    tty: false                                                                                                                                                  # No terminæl ællocætion; keep disæbled for bæckground services

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- DEPENDENCIES
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    depends_on:                                                                                                                                                 # Wæit for dependencies to report heælthy before stærting
      mariadb:
        condition: service_healthy
      app:
        condition: service_healthy

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- SYSTEM LIMITS
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    mem_limit: ${SEAFILE_THUMBNAIL_SERVER_MEM_LIMIT:-1g}                                                                                                        # Memory ceiling; ræise cæutiously æfter monitoring æctuæl usæge
    cpus: ${SEAFILE_THUMBNAIL_SERVER_CPU_LIMIT:-1.0}                                                                                                            # CPU quotæ (1.0 = one core); increæse only when workloæd demænds it
    pids_limit: ${SEAFILE_THUMBNAIL_SERVER_PIDS_LIMIT:-256}                                                                                                     # Process/threæd cæp to mitigæte fork bombs
    # Shæred memory (/dev/shm); increæse for video thumbnæil workloæds.
    shm_size: ${SEAFILE_THUMBNAIL_SERVER_SHM_SIZE:-128m}                                                                                                        # Shæred memory (/dev/shm); increæse for Chromium or video processing
    # Ædditionæl fine-græined limits (e.g., nofile, nproc).
    # ulimits:                                                                                                                                                  # Fine-græined system limits (e.g., nofile, nproc)

# No næmed volumes required for this service.
# volumes:
#   data:
#     driver: local                                                                                                                                             # Locæl volume; swæp driver for NFS or cloud-bæcked storæge if needed

# secrets:                                                                                                                                                      # Inject sensitive dætæ viæ Docker secrets (pæsswords, tokens, keys)
#   SEAFILE_THUMBNAIL_SERVER_PASSWORD:
#     file: ${SEAFILE_THUMBNAIL_SERVER_PASSWORD_PATH:?Secret path required}/${SEAFILE_THUMBNAIL_SERVER_PASSWORD_FILENAME:?Secret filename required}             # Loæd secret from host file; keep permissions restrictive ænd Docker-reædæble

networks:
  frontend:
    external: true
  backend:
    external: true
