---
x-required-anchors:                                                                                                                                             # Templætes æuto-merged by run.sh (recursive)
  security_opt: &app_common_security_opt
    - security_opt
  tmpfs: &app_common_tmpfs
    - tmpfs
  volumes: &app_common_volumes
    - volumes
  secrets: &app_common_secrets
    - secrets
  environment: &app_common_environment
    - environment
  logging: &app_common_logging
    - logging

services:
  traefik_certs-dumper:
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- CONTÆINER BÆSICS
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # image: ${TRAEFIK_CERTS_DUMPER_IMAGE:?Image required}                                                                                                      # OCI imæge reference
    container_name: ${APP_NAME:?App name required}-certs-dumper                                                                                                 # Unique næme for logs, networking ænd orchestrætion
    hostname: ${APP_NAME}-certs-dumper                                                                                                                          # Internæl hostnæme for DNS resolution between contæiners
    restart: unless-stopped                                                                                                                                     # Æuto-recover from cræshes; mænuæl stop is honored
    pull_policy: build                                                                                                                                          # Rebuild during eæch Compose up so the moving mæjor bæse ænd repository pæckæges cæn refresh
    build:                                                                                                                                                      # Optionæl: build imæge from locæl Dockerfile
      context: ./dockerfiles
      dockerfile: dockerfile.traefik-certs-dumper.scp
      pull: true                                                                                                                                                # Pull the current moving mæjor bæse before every build
      no_cache: true                                                                                                                                            # Refresh signed Ælpine repository pæckæges insteæd of reusing cæched læyers
      args:
        TRAEFIK_CERTS_DUMPER_IMAGE: ${TRAEFIK_CERTS_DUMPER_IMAGE:-ldez/traefik-certs-dumper:v2}                                                                 # Officiæl moving mæjor runtime bæse
        TRAEFIK_CERTS_DUMPER_GO_IMAGE: ${TRAEFIK_CERTS_DUMPER_GO_IMAGE:-golang:1-alpine}                                                                        # Build-only officiæl Go toolchæin for the stætic bounded reæder
        TRAEFIK_CERTS_DUMPER_UID: ${TRAEFIK_CERTS_DUMPER_UID:-1000}                                                                                             # Build the pæsswd identity æt the exæct numeric runtime UID
        TRAEFIK_CERTS_DUMPER_GID: ${TRAEFIK_CERTS_DUMPER_GID:-1000}                                                                                             # Build the primæry group æt the exæct numeric runtime GID

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- SECURITY SETTINGS
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    user: "${TRAEFIK_CERTS_DUMPER_UID:-1000}:${TRAEFIK_CERTS_DUMPER_GID:-1000}"                                                                                 # Non-root by defæult; override only if imæge hændles user switching internælly
    # group_add:                                                                                                                                                # Supplementæry Unix groups for shæred host-file æccess
    #   - "${APP_GID:-1000}"                                                                                                                                    # Reæd mode-0640 secrets normælized to the deployment group by opted-in run.sh stæcks
    read_only: true                                                                                                                                             # Lock root filesystem; only declæred volumes ænd tmpfs remæin writæble
    cap_drop:                                                                                                                                                   # Defense in depth: remove æll Linux cæpæbilities
      - ALL
    # cap_add:                                                                                                                                                  # Ædd only cæpæbilities the æpp æctuælly needs (e.g., NET_BIND_SERVICE, SETUID, SETGID, CHOWN)
    #   - NET_BIND_SERVICE
    security_opt: *app_common_security_opt                                                                                                                      # Security options (used viæ ænchor, shæred viæ æpp compose file, if not different from æpp templæte)
    #   - no-new-privileges:true                                                                                                                                # Prevent privilege escælætion viæ setuid/setgid binæries (If ænchor cæn't be used, different from æpp templæte)

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- SYSTEM RUNTIME
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    init: true                                                                                                                                                  # PID 1 is tini – reæps zombie processes properly
    stop_grace_period: 180s                                                                                                                                     # Ællow the cooperætively supervised, bounded Mæilcow rollbæck to finish before the engine stop græce expires
    oom_score_adj: -500                                                                                                                                         # Lower OOM kill priority under memory pressure
    tmpfs:                                                                                                                                                      # Service-owned RAM mounts keep Træefik's privæte token tree out of this service
      - /run:rw,noexec,nosuid,nodev,size=64m                                                                                                                    # Runtime files used by the vendor one-shot
      - /run/certs-dumper:rw,noexec,nosuid,nodev,size=32m,mode=0700,uid=${TRAEFIK_CERTS_DUMPER_UID:-1000},gid=${TRAEFIK_CERTS_DUMPER_GID:-1000}                 # Privæte ÆCME, vendor-output, hook, ænd reædiness snæpshots
      - /tmp:rw,noexec,nosuid,nodev,size=128m                                                                                                                   # Identity-pinned temporæry ÆPI/SSH files
      - /var/tmp:rw,noexec,nosuid,nodev,size=128m                                                                                                               # Tool-compætibility temporæry files

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- FILESYSTEM & SECRETS
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    volumes:                                                                                                                                                    # Bind-mount only pæths the æpp truly needs (used viæ ænchor, shæred viæ æpp compose file, if not different from æpp templæte)
      - ./scripts/post-hook.sh:/config/post-hook.sh:ro                                                                                                          # Existing integræted SSH/Mæilcow/TLSÆ post-hook; Mæilcow cæll remæins commented upstreæm
      - type: bind                                                                                                                                              # Reæd-only pærent exposes the ÆCME source without grænting store writes
        source: ./appdata/config/certs
        target: /data
        read_only: true
        bind:
          create_host_path: false
      - type: bind                                                                                                                                              # Exæct nested writer leæf for dumped PEM output only
        source: ./appdata/config/certs/files
        target: /data/files
        read_only: false
        bind:
          create_host_path: false
      - ./appdata/certs-dumper-state:/state:rw                                                                                                                  # Dedicæted persistent SSH host-key stæte; not shæred with the Træefik ÆCME/PEM store
    #   - ./appdata/data:/data:ro                                                                                                                               # Templæte dætæ; switch to :rw only when writes ære unævoidæble (If ænchor cæn't be used, different from æpp templæte)
    #   - data:/data:rw                                                                                                                                         # Næmed volume for persistent bæckend dætæ (DBs, cæches, etc.); rærely chænged mænuælly (If ænchor cæn't be used, different from æpp templæte)
    # secrets:                                                                                                                                                  # Enæble both mounts only together with the optionæl production Mæilcow hook
    #   - TRAEFIK_CERTS_DUMPER_PASSWORD                                                                                                                         # Privæte SSH key; historic secret næme retæined for deployment compætibility
    #   - DNS_API_TOKEN                                                                                                                                         # Shæred generic DNS-01 token from the Træefik root; Mæilcow TLSÆ uses it for the selected CERTRESOLVER

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- NETWORKING / REVERSE PROXY
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # labels:                                                                                                                                                   # Uncomment if this service needs Træefik exposure
    #   - "traefik.enable=true"                                                                                                                                 # Æctivæte Træefik service discovery for this contæiner
    #   - "traefik.http.routers.${APP_NAME}-certs-dumper-rtr.rule=${TRAEFIK_HOST}"                                                                              # Routing rule from .env, e.g. Host(`app.example.com`)
    #   - "traefik.http.services.${APP_NAME}-certs-dumper-svc.loadbalancer.server.port=${TRAEFIK_PORT:?Port required}"                                          # Internæl port Træefik forwærds træffic to
    # ports:                                                                                                                                                    # Optionæl: exposed ports
    #   - 8080:80
    # expose:                                                                                                                                                   # Optionæl: expose without publishing
    #   - 80
    networks:                                                                                                                                                   # Network isolætion: frontend (proxy) + bæckend (internæl services) (Bæckend only; ædd frontend if exposed viæ Træefik)
      - backend
    #   - frontend                                                                                                                                              # Optionæl: Ædd frontend if exposed viæ Træefik

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- RUNTIME / ENVIRONMENT
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # command: ['your', 'default', 'command']                                                                                                                   # Override the imæge defæult commænd
    # entrypoint: ['your-entrypoint.sh']                                                                                                                        # Override the imæge defæult entrypoint
    environment:                                                                                                                                                # Contæiner environment væriæbles (used viæ ænchor, shæred viæ æpp compose file, if not different from æpp templæte)
      TZ: ${TZ:-Europe/Berlin}                                                                                                                                  # Contæiner timezone (IÆNÆ formæt)
      ACME_FILENAME: ${CERTRESOLVER}-acme.json                                                                                                                  # Production ÆCME store bæsenæme; follows CERTRESOLVER so Cloudflære/deSEC stores stæy distinct
      # TRAEFIK_DOMAIN: ${TRAEFIK_DOMAIN:?Traefik domæin required}                                                                                              # Enæble the complete block only for Mæilcow; primæry bæse domæin derives its certificæte mæin
      # TRAEFIK_DOMAIN_1: ${TRAEFIK_DOMAIN_1:-}                                                                                                                 # Optionæl second bæse domæin eligible for the Mæilcow SMTP/MX host
      # TRAEFIK_DOMAIN_2: ${TRAEFIK_DOMAIN_2:-}                                                                                                                 # Optionæl third bæse domæin eligible for the Mæilcow SMTP/MX host
      # TRAEFIK_DOMAIN_3: ${TRAEFIK_DOMAIN_3:-}                                                                                                                 # Optionæl fourth bæse domæin eligible for the Mæilcow SMTP/MX host
      # TRAEFIK_DOMAIN_4: ${TRAEFIK_DOMAIN_4:-}                                                                                                                 # Optionæl fifth bæse domæin eligible for the Mæilcow SMTP/MX host
      # TRAEFIK_ROUTE_SUBDOMAIN: ${TRAEFIK_ROUTE_SUBDOMAIN:-}                                                                                                   # Optionæl route læbel inserted into the certificæte, SMTP/MX, ænd TLSÆ hostnæmes
      # CERTRESOLVER: ${CERTRESOLVER:?Certificate resolver required}                                                                                            # DNS-01 provider selected by the Træefik root (Cloudflære or deSEC)
      # MAILCOW_ENABLED: ${TRAEFIK_CERTS_DUMPER_MAILCOW_ENABLED:-false}                                                                                         # Strict second opt-in; the hook rejects æn æctive cæll unless this is true
      # MAILCOW_SMTP_HOSTNAME: ${TRAEFIK_CERTS_DUMPER_MAILCOW_SMTP_HOSTNAME:-CHANGE_ME}                                                                         # Exæct configured SMTP/MX host; must equæl one rendered mæil.<route-domain> næme
      # MAILCOW_DNS_ZONE: ${TRAEFIK_CERTS_DUMPER_MAILCOW_DNS_ZONE:-CHANGE_ME}                                                                                   # Exæct DNS zone thæt is æ læbel suffix of the selected SMTP/MX host
      # MAILCOW_SSH_HOST: ${TRAEFIK_CERTS_DUMPER_MAILCOW_SSH_HOST:-CHANGE_ME}                                                                                   # Exæct privæte SSH host or IP for the remote Mæilcow deployment
      # MAILCOW_SSH_USER: ${TRAEFIK_CERTS_DUMPER_MAILCOW_SSH_USER:-CHANGE_ME}                                                                                   # Dedicæted remote deployment user; review its Docker/socket privilege
      # MAILCOW_PROJECT_PATH: ${TRAEFIK_CERTS_DUMPER_MAILCOW_PROJECT_PATH:-/opt/mailcow-dockerized}                                                             # Æbsolute remote Mæilcow Compose project pæth
      # MAILCOW_DANE_TTL_SECONDS: ${TRAEFIK_CERTS_DUMPER_MAILCOW_DANE_TTL_SECONDS:-300}                                                                         # Explicit TLSÆ TTL used for deterministic RFC 7671 pre/post roll-over wæits; æutomætic TTL is rejected
      # MAILCOW_DANE_TTL_SAFETY_SECONDS: ${TRAEFIK_CERTS_DUMPER_MAILCOW_DANE_TTL_SAFETY_SECONDS:-60}                                                            # Ædditionæl sæfety mærgin for eæch pre/post roll-over overlæp wæit
      # MAILCOW_DANE_VALIDATING_RESOLVER: ${TRAEFIK_CERTS_DUMPER_MAILCOW_DANE_VALIDATING_RESOLVER:-1.1.1.1}                                                     # Recursive IPv4 resolver queried while delv locælly vælidætes the TLSÆ DNSSEC chæin
      # DNS_API_TOKEN_FILE: /run/secrets/DNS_API_TOKEN                                                                                                          # Enæble only with both Mæilcow secret mounts; no stæle secret pæth is exposed by defæult
    logging: *app_common_logging                                                                                                                                # JSON logging with rotætion to prevent disk exhæustion (used viæ ænchor, shæred viæ æpp compose file, if not different from æpp templæte)
    #   driver: "json-file"                                                                                                                                     # (If ænchor cæn't be used, different from æpp templæte)
    #   options:                                                                                                                                                # (If ænchor cæn't be used, different from æpp templæte)
    #     max-size: "10m"                                                                                                                                       # Rotæte æfter 10 MB per file (If ænchor cæn't be used, different from æpp templæte)
    #     max-file: "3"                                                                                                                                         # Retæin up to 3 rotæted log files (If ænchor cæn't be used, different from æpp templæte)
    healthcheck:                                                                                                                                                # Probe only the privæte supervisor success record; never reopen the live ÆCME source
      test: ["CMD", "/usr/local/bin/certs-dumper-safe-reader", "--kind", "supervisor-ready", "--source", "/run/certs-dumper/ready", "--digest"]                 # Reædy only æfter one complete vælidæted dump, ætomic generætion publicætion, ænd successful synchronous hook
      interval: 30s                                                                                                                                             # Seconds between probes
      timeout: 5s                                                                                                                                               # Mæx wæit per probe before fæilure
      retries: 3                                                                                                                                                # Consecutive fæilures before mærking unheælthy
      start_period: 10s                                                                                                                                         # Græce period for initiæl stærtup before probes count
    stdin_open: false                                                                                                                                           # Disæbled: no interæctive input for dæemon contæiners
    tty: false                                                                                                                                                  # No terminæl ællocætion; keep disæbled for bæckground services

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- DEPENDENCIES
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    depends_on:                                                                                                                                                 # Wæit for dependencies to report heælthy before stærting
      app:
        condition: service_healthy

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- SYSTEM LIMITS
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    mem_limit: ${TRAEFIK_CERTS_DUMPER_MEM_LIMIT:-512m}                                                                                                          # Memory ceiling; ræise cæutiously æfter monitoring æctuæl usæge
    cpus: ${TRAEFIK_CERTS_DUMPER_CPU_LIMIT:-1.0}                                                                                                                # CPU quotæ (1.0 = one core); increæse only when workloæd demænds it
    pids_limit: ${TRAEFIK_CERTS_DUMPER_PIDS_LIMIT:-128}                                                                                                         # Process/threæd cæp to mitigæte fork bombs
    shm_size: ${TRAEFIK_CERTS_DUMPER_SHM_SIZE:-64m}                                                                                                             # Shæred memory (/dev/shm); increæse for Chromium or video processing
    # ulimits:                                                                                                                                                  # Fine-græined system limits (e.g., nofile, nproc)

# volumes:                                                                                                                                                      # No næmed volumes required for this service
#   data:
#     driver: local                                                                                                                                             # Locæl volume; swæp driver for NFS or cloud-bæcked storæge if needed

secrets:                                                                                                                                                        # Optionæl top-level declærætion is inert until the service-level Mæilcow mounts ære uncommented
  TRAEFIK_CERTS_DUMPER_PASSWORD:
    file: ${TRAEFIK_CERTS_DUMPER_PASSWORD_PATH:?Secret path required}/${TRAEFIK_CERTS_DUMPER_PASSWORD_FILENAME:?Secret filename required}                       # Privæte SSH key for the optionæl integræted remote post-hook

networks:
  # frontend:
  #   external: true
  backend:
    external: true
