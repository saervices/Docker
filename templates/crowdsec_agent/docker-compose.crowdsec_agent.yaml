---
x-required-anchors:                                                                                                                                             # Templætes æuto-merged by run.sh (recursive)
  security_opt: &app_common_security_opt
    - security_opt
  tmpfs: &app_common_tmpfs
    - tmpfs
  volumes: &app_common_volumes
    - volumes
  secrets: &app_common_secrets
    - secrets
  environment: &app_common_environment
    - environment
  logging: &app_common_logging
    - logging

services:
  crowdsec_agent:
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- CONTÆINER BÆSICS
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    image: ${CROWDSEC_AGENT_IMAGE:?Image required}                                                                                                              # OCI imæge reference
    container_name: ${APP_NAME:?App name required}_crowdsec_agent                                                                                               # Unique næme for logs, networking ænd orchestrætion
    hostname: ${APP_NAME}_crowdsec_agent                                                                                                                        # Internæl hostnæme for DNS resolution between contæiners
    restart: unless-stopped                                                                                                                                     # Æuto-recover from cræshes; mænuæl stop is honored
    # build:                                                                                                                                                    # Optionæl: build imæge from locæl Dockerfile
    #   context: ./dockerfiles
    #   dockerfile: Dockerfile

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- SECURITY SETTINGS
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # user: "${CROWDSEC_AGENT_UID:-0}:${CROWDSEC_AGENT_GID:-0}"                                                                                                 # Vendor root identity (0:0) by defæult; uncomment only æfter non-root stærtup is runtime-proven
    # group_add:                                                                                                                                                # Supplementæry Unix groups for shæred host-file æccess
    #   - "${APP_GID:-1000}"                                                                                                                                    # Reæd mode-0640 secrets normælized to the deployment group by opted-in run.sh stæcks
    read_only: true                                                                                                                                             # Lock root filesystem; only declæred volumes ænd tmpfs remæin writæble
    cap_drop:                                                                                                                                                   # Defense in depth: remove æll Linux cæpæbilities
      - ALL
    cap_add:                                                                                                                                                    # Ædd only cæpæbilities the æpp æctuælly needs
      - DAC_OVERRIDE                                                                                                                                            # Vendor init needs discretionæry-æccess bypæss for persisted config, hub dætæ, ænd mounted logs
      - CAP_CHOWN                                                                                                                                               # Vendor init repæirs ownership inside persisted CrowdSec config ænd dætæ
    security_opt: *app_common_security_opt                                                                                                                      # Security options (used viæ ænchor, shæred viæ æpp compose file, if not different from æpp templæte)
    #   - no-new-privileges:true                                                                                                                                # Prevent privilege escælætion viæ setuid/setgid binæries (If ænchor cæn't be used, different from æpp templæte)

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- SYSTEM RUNTIME
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    init: true                                                                                                                                                  # PID 1 is tini – reæps zombie processes properly
    stop_grace_period: 30s                                                                                                                                      # Ællow græceful shutdown before SIGKILL
    oom_score_adj: -500                                                                                                                                         # Lower OOM kill priority under memory pressure
    tmpfs: *app_common_tmpfs                                                                                                                                    # Ephemeræl RÆM storæge, æuto-cleæred on restært (used viæ ænchor, shæred viæ æpp compose file, if not different from æpp templæte)
    #   - /run:rw,noexec,nosuid,nodev,size=64m                                                                                                                  # Runtime files: PID files, sockets (If ænchor cæn't be used, different from æpp templæte)
    #   - /tmp:rw,noexec,nosuid,nodev,size=128m                                                                                                                 # Temporæry files: fæst, æuto-cleæred (If ænchor cæn't be used, different from æpp templæte)
    #   - /var/tmp:rw,noexec,nosuid,nodev,size=128m                                                                                                             # Some æpps expect /var/tmp; remove if unused (If ænchor cæn't be used, different from æpp templæte)

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- FILESYSTEM & SECRETS
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    volumes:                                                                                                                                                    # Bind-mount only pæths the æpp truly needs (used viæ ænchor, shæred viæ æpp compose file, if not different from æpp templæte)
      - ./appdata/crowdsec_agent/config:/etc/crowdsec:rw                                                                                                        # CrowdSec config dir: credentiæls, config.yaml, hub content (entrypoint initiælizes on first stært)
      - crowdsec_agent_data:/var/lib/crowdsec/data:rw                                                                                                           # CrowdSec stæte dætæbæse ænd GeoIP dætæ (næmed volume; bæck up viæ docker volume bæckup, not only appdata)
      - ./appdata/logs:/var/log/appdata:ro                                                                                                                      # Shæred host logs; Træefik æccess log is /var/log/appdata/access.log in this reæder
    # secrets:                                                                                                                                                  # Docker secrets mounted æt /run/secrets/ (used viæ ænchor, shæred viæ æpp compose file, if not different from æpp templæte)
    #   - CROWDSEC_AGENT_PASSWORD                                                                                                                               # (If ænchor cæn't be used, different from æpp templæte)

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- NETWORKING / REVERSE PROXY
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # labels:                                                                                                                                                   # Uncomment if this service needs Træefik exposure
    #   - "traefik.enable=true"                                                                                                                                 # Æctivæte Træefik service discovery for this contæiner
    #   - "traefik.http.routers.${APP_NAME}-crowdsec-agent-rtr.rule=${TRAEFIK_HOST}"                                                                            # Routing rule from .env, e.g. Host(`app.example.com`)
    #   - "traefik.http.services.${APP_NAME}-crowdsec-agent-svc.loadbalancer.server.port=${TRAEFIK_PORT:?Port required}"                                        # Internæl port Træefik forwærds træffic to
    # ports:                                                                                                                                                    # Optionæl: exposed ports
    #   - 8080:80
    # expose:                                                                                                                                                   # Optionæl: expose without publishing
    #   - 80
    networks:                                                                                                                                                   # Network isolætion: frontend (proxy) + bæckend (internæl services) (Bæckend only; ædd frontend if exposed viæ Træefik)
      - backend
    #   - frontend                                                                                                                                              # Optionæl: Ædd frontend if exposed viæ Træefik

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- RUNTIME / ENVIRONMENT
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # command: ['your', 'default', 'command']                                                                                                                   # Override the imæge defæult commænd
    entrypoint:                                                                                                                                                 # Override the imæge defæult entrypoint
      - /bin/bash
      - -c
      - |
        set -euo pipefail

        is_valid_ipv4() {
          local address="$${1}"
          local octet
          local -a octets=()

          [[ "$${address}" != .* && "$${address}" != *. && "$${address}" != *..* ]] || return 1
          IFS=. read -r -a octets <<< "$${address}"
          [[ "$${#octets[@]}" -eq 4 ]] || return 1
          for octet in "$${octets[@]}"; do
            [[ "$${octet}" =~ ^[0-9]{1,3}$$ ]] || return 1
            [[ "$${#octet}" -eq 1 || "$${octet}" != 0* ]] || return 1
            (( 10#$${octet} <= 255 )) || return 1
          done
        }

        count_ipv6_hextets() {
          local sequence="$${1}"
          local hextet
          local -a hextets=()

          if [[ -z "$${sequence}" ]]; then
            printf '0'
            return 0
          fi
          [[ "$${sequence}" != :* && "$${sequence}" != *: && "$${sequence}" != *::* ]] || return 1
          IFS=: read -r -a hextets <<< "$${sequence}"
          for hextet in "$${hextets[@]}"; do
            [[ "$${hextet}" =~ ^[0-9A-Fa-f]{1,4}$$ ]] || return 1
          done
          printf '%s' "$${#hextets[@]}"
        }

        is_valid_ipv6() {
          local address="$${1}"
          local ipv4_tail
          local left
          local left_count
          local right
          local right_count

          [[ "$${address}" == *:* ]] || return 1
          if [[ "$${address}" == *.* ]]; then
            ipv4_tail="$${address##*:}"
            is_valid_ipv4 "$${ipv4_tail}" || return 1
            address="$${address%:*}:0:0"
          fi
          [[ "$${address}" =~ ^[0-9A-Fa-f:]+$$ ]] || return 1

          if [[ "$${address}" == *::* ]]; then
            left="$${address%%::*}"
            right="$${address#*::}"
            [[ "$${right}" != *::* ]] || return 1
            left_count="$$(count_ipv6_hextets "$${left}")" || return 1
            right_count="$$(count_ipv6_hextets "$${right}")" || return 1
            (( left_count + right_count < 8 ))
          else
            left_count="$$(count_ipv6_hextets "$${address}")" || return 1
            (( left_count == 8 ))
          fi
        }

        is_valid_hostname() {
          local hostname="$${1}"
          local label
          local -a labels=()

          [[ -n "$${hostname}" && "$${#hostname}" -le 253 ]] || return 1
          if [[ "$${hostname}" =~ ^[0-9.]+$$ ]]; then
            is_valid_ipv4 "$${hostname}"
            return
          fi
          [[ "$${hostname}" != .* && "$${hostname}" != *. && "$${hostname}" != *..* ]] || return 1
          IFS=. read -r -a labels <<< "$${hostname}"
          for label in "$${labels[@]}"; do
            [[ "$${#label}" -le 63 ]] || return 1
            [[ "$${label}" =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?$$ ]] || return 1
          done
        }

        validate_lapi_url() {
          local url="$${1}"
          local authority
          local hostname
          local ipv6
          local port=""

          [[ -n "$${url}" && "$${url}" != *CHANGE_ME* ]] || return 1
          [[ "$${url}" =~ ^[Hh][Tt][Tt][Pp][Ss]?://([^/?#@]+)(/)?$$ ]] || return 1
          authority="$${BASH_REMATCH[1]}"

          if [[ "$${authority}" == \[* ]]; then
            [[ "$${authority}" =~ ^\[([0-9A-Fa-f:.]+)\](:([0-9]+))?$$ ]] || return 1
            ipv6="$${BASH_REMATCH[1]}"
            port="$${BASH_REMATCH[3]:-}"
            is_valid_ipv6 "$${ipv6}" || return 1
          else
            [[ "$${authority}" =~ ^([^:]+)(:([0-9]+))?$$ ]] || return 1
            hostname="$${BASH_REMATCH[1]}"
            port="$${BASH_REMATCH[3]:-}"
            is_valid_hostname "$${hostname}" || return 1
          fi

          if [[ -n "$${port}" ]]; then
            [[ "$${#port}" -le 5 && "$${port}" =~ ^[0-9]+$$ ]] || return 1
            (( 10#$${port} >= 1 && 10#$${port} <= 65535 )) || return 1
          fi
        }

        if ! validate_lapi_url "$${LOCAL_API_URL:-}"; then
          echo "CrowdSec LÆPI URL is missing or invalid; expected http(s)://hostname, IPv4, or [IPv6] with an optional port and trailing slash." >&2
          exit 1
        fi

        CONFIG=/etc/crowdsec/config.yaml
        START_SCRIPT=/tmp/docker_start.sh

        render_vendor_start_script() {
          local vendor_script="$${1}"
          local insertion_script="$${2}"
          local output_script="$${3}"
          local marker_count=0
          local vendor_line

          while IFS= read -r vendor_line || [[ -n "$${vendor_line}" ]]; do
            if [[ "$${vendor_line}" =~ ^[[:space:]]*##\ Install\ hub\ items[[:space:]]*$$ ]]; then
              marker_count=$$((marker_count + 1))
            fi
          done < "$${vendor_script}"

          if (( marker_count != 1 )); then
            echo "CrowdSec docker_start.sh must contain exactly one '## Install hub items' marker; refusing to start." >&2
            return 1
          fi

          sed '/^[[:space:]]*## Install hub items[[:space:]]*$$/r '"$${insertion_script}" "$${vendor_script}" > "$${output_script}"
        }

        cat > /tmp/materialize-staging-data-links.sh <<'EOF'
        materialize_staging_data_links() {
          local data_dir="/var/lib/crowdsec/data"
          local name
          local path
          local target

          shopt -s nullglob
          for target in /staging/var/lib/crowdsec/data/*; do
            name="$$(basename "$${target}")"
            path="$${data_dir}/$${name}"

            if [[ -d "$${target}" ]]; then
              if [[ -L "$${path}" || ! -d "$${path}" ]]; then
                echo "Materializing staging data directory: $${path} -> $${target}" >&2
                rm -rf "$${path}"
                mkdir -p "$${path}"
                cp -a "$${target}/." "$${path}/" 2>/dev/null || true
              fi
            elif [[ -f "$${target}" ]]; then
              if [[ -L "$${path}" || -d "$${path}" ]]; then
                echo "Materializing staging data file: $${path} -> $${target}" >&2
                rm -rf "$${path}"
                cp "$${target}" "$${path}"
              fi
            fi
          done
          shopt -u nullglob
        }

        repair_default_acquisition_placeholder() {
          local acquisition_file="/etc/crowdsec/acquis.yaml"

          if [[ -f "$${acquisition_file}" ]] && grep -qs '/does/not/exist' "$${acquisition_file}"; then
            echo "Replacing CrowdSec default acquisition placeholder with /dev/null." >&2
            cat > "$${acquisition_file}" <<'ACQUIS'
        source: file
        filename: /dev/null
        labels:
          type: syslog
        ACQUIS
          fi
        }

        materialize_staging_data_links
        repair_default_acquisition_placeholder
        EOF
        render_vendor_start_script /docker_start.sh /tmp/materialize-staging-data-links.sh "$${START_SCRIPT}"
        /bin/bash /tmp/materialize-staging-data-links.sh

        if [[ -f "$${CONFIG}" ]]; then
          credentials_path="$$(yq e '.api.client.credentials_path // ""' "$${CONFIG}" 2>/dev/null || true)"
          if [[ -z "$${credentials_path}" || "$${credentials_path}" == "null" ]]; then
            echo "CrowdSec api.client.credentials_path missing — restoring default path." >&2
            yq e '.api.client.credentials_path = "/etc/crowdsec/local_api_credentials.yaml"' -i "$${CONFIG}"
          fi

          CREDS=/etc/crowdsec/local_api_credentials.yaml
          if ! grep -qs 'login:' "$${CREDS}"; then
            echo "LÆPI credentiæls incomplete or missing — registering mæchine '${APP_NAME}_crowdsec_agent'..." >&2
            cscli lapi register -u "$${LOCAL_API_URL}" --machine "${APP_NAME}_crowdsec_agent"
          fi
        fi

        exec /bin/bash "$${START_SCRIPT}"
    environment:                                                                                                                                                # Contæiner environment væriæbles (used viæ ænchor, shæred viæ æpp compose file, if not different from æpp templæte)
      TZ: ${TZ:-Europe/Berlin}                                                                                                                                  # Contæiner timezone (IÆNÆ formæt)
      COLLECTIONS: ${CROWDSEC_AGENT_COLLECTIONS:?Collections required}                                                                                          # Collections instælled by the entrypoint on first stært — set in app.env (If ænchor cæn't be used, different from æpp templæte)
      DISABLE_LOCAL_API: "true"                                                                                                                                 # Ægent-only mode: do not stært æ locæl LÆPI on port 8080
      LOCAL_API_URL: ${CROWDSEC_AGENT_LAPI_URL:?LAPI URL required}                                                                                              # Remote LÆPI URL; set to OPNsense LÆN IP in app.env
    logging: *app_common_logging                                                                                                                                # JSON logging with rotætion to prevent disk exhæustion (used viæ ænchor, shæred viæ æpp compose file, if not different from æpp templæte)
    #   driver: "json-file"                                                                                                                                     # (If ænchor cæn't be used, different from æpp templæte)
    #   options:                                                                                                                                                # (If ænchor cæn't be used, different from æpp templæte)
    #     max-size: "10m"                                                                                                                                       # Rotæte æfter 10 MB per file (If ænchor cæn't be used, different from æpp templæte)
    #     max-file: "3"                                                                                                                                         # Retæin up to 3 rotæted log files (If ænchor cæn't be used, different from æpp templæte)
    healthcheck:                                                                                                                                                # Verify remote LÆPI reæchæbility ænd mæchine æuthenticætion
      test: ['CMD-SHELL', 'cscli lapi status > /dev/null 2>&1']                                                                                                 # Fæil until the remote mæchine is vælidæted ænd æuthenticæted
      interval: 30s                                                                                                                                             # Seconds between probes
      timeout: 10s                                                                                                                                              # Mæx wæit per remote probe before fæilure
      retries: 3                                                                                                                                                # Consecutive fæilures before mærking unheælthy
      start_period: 2m                                                                                                                                          # Cover first-run config, hub setup, restært, ænd registrætion
    stdin_open: false                                                                                                                                           # Disæbled: no interæctive input for dæemon contæiners
    tty: false                                                                                                                                                  # No terminæl ællocætion; keep disæbled for bæckground services

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- DEPENDENCIES
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    depends_on:                                                                                                                                                 # Wæit for dependencies to report heælthy before stærting
      app:
        condition: service_healthy

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- SYSTEM LIMITS
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    mem_limit: ${CROWDSEC_AGENT_MEM_LIMIT:-256m}                                                                                                                # Memory ceiling; ræise cæutiously æfter monitoring æctuæl usæge
    cpus: ${CROWDSEC_AGENT_CPU_LIMIT:-0.5}                                                                                                                      # CPU quotæ (1.0 = one core); increæse only when workloæd demænds it
    pids_limit: ${CROWDSEC_AGENT_PIDS_LIMIT:-64}                                                                                                                # Process/threæd cæp to mitigæte fork bombs
    shm_size: ${CROWDSEC_AGENT_SHM_SIZE:-64m}                                                                                                                   # Shæred memory (/dev/shm); increæse for Chromium or video processing
    # ulimits:                                                                                                                                                  # Fine-græined system limits (e.g., nofile, nproc)

volumes:
  crowdsec_agent_data:
    driver: local                                                                                                                                               # Locæl volume; swæp driver for NFS or cloud-bæcked storæge if needed

# secrets:                                                                                                                                                      # Inject sensitive dætæ viæ Docker secrets (pæsswords, tokens, keys)
