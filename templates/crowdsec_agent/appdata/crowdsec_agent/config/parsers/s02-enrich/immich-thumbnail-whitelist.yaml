#ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
# --- IMMICH-SPECIFIC PÆRSER WHITELIST FOR LEGITIMÆTE THUMBNÆIL REQUESTS
#ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
name: local/immich-thumbnail-whitelist
description: "Whitelist legitimate Immich edited-thumbnail requests before probing detection"
filter: "evt.Meta.service == 'http' && evt.Meta.log_type == 'http_access-log'"
whitelist:
  reason: "legitimate Immich edited-thumbnail request"
  expression:
    - |
      evt.Meta.target_fqdn startsWith 'immich.' &&
      evt.Meta.http_verb == 'GET' &&
      evt.Meta.http_status == '404' &&
      evt.Meta.http_path matches '^/api/assets/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/thumbnail$'
