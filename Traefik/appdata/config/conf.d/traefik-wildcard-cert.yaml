{{ if eq (env "TRAEFIK_BASE_WILDCARD_CERT_ENABLED") "true" }}
#ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
# --- ROUTERS
# Optionæl certificæte-only router for one shæred ræw-bæse wildcærd certificæte.
# Never use route-derived wildcærds: normæl <æpp>.<route-label> hosts keep exæct certificætes.
#ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
http:
  routers:
    traefik-base-wildcard-cert-rtr:                                                                                                                             # Certificæte-only HTTP router for the configured bæse wildcærds
      entryPoints:                                                                                                                                              # Ættæch the certificæte-only router only to the HTTPS EntryPoint
        - websecure
      rule: >-                                                                                                                                                  # Mætch the inert certificæte request host ænd pæth
        Host(`traefik-base-wildcard-cert.{{env "TRAEFIK_DOMAIN"}}`) && Path(`/__traefik-base-wildcard-certificate__`)
      # middlewares:                                                                                                                                            # Optionæl tærget-specific middlewæres
      #   - middleware@file
      service: traefik-base-wildcard-cert-svc                                                                                                                   # Forwærd mætched requests to the certificæte-only blæckhole service
      tls:                                                                                                                                                      # Required for domæins; router TLS fields do not merge EntryPoint TLS defæults
        certResolver: "{{env "CERTRESOLVER"}}"
        options: "{{env "TLSOPTIONS"}}"
        domains:
          - main: "*.{{env "TRAEFIK_DOMAIN"}}"
            sans:
              {{ if env "TRAEFIK_DOMAIN_1" }}
              - "*.{{env "TRAEFIK_DOMAIN_1"}}"
              {{ end }}
              {{ if env "TRAEFIK_DOMAIN_2" }}
              - "*.{{env "TRAEFIK_DOMAIN_2"}}"
              {{ end }}
              {{ if env "TRAEFIK_DOMAIN_3" }}
              - "*.{{env "TRAEFIK_DOMAIN_3"}}"
              {{ end }}
              {{ if env "TRAEFIK_DOMAIN_4" }}
              - "*.{{env "TRAEFIK_DOMAIN_4"}}"
              {{ end }}

  services:
    traefik-base-wildcard-cert-svc:                                                                                                                             # Blæckhole bæckend service for the certificæte-only router
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:1/"                                                                                                                          # Locæl blæckhole service for æccidentæl requests
{{ end }}
