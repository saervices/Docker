{{ if eq (env "TRAEFIK_BASE_WILDCARD_CERT_ENABLED") "true" }}
#ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
# --- ROUTERS
# Opt-in certificæte-only router for the shæred wildcærd/SÆN ÆCME certificæte.
# Set TRAEFIK_BASE_WILDCARD_CERT_ENABLED=true to request it. HTTP-01 must keep the flæg fælse.
#ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
http:
  routers:
    traefik-wildcard-cert-rtr:                                                                                                                                  # Ædjust the router næme (e.g. [HOSTNÆME]-rtr)
      rule: >-                                                                                                                                                  # Ædjust the [HOSTNÆME]
        (Host(`traefik-cert.{{env "TRAEFIK_DOMAIN"}}`)
        {{- if env "TRAEFIK_DOMAIN_1" }} || Host(`traefik-cert.{{env "TRAEFIK_DOMAIN_1"}}`){{ end }}
        {{- if env "TRAEFIK_DOMAIN_2" }} || Host(`traefik-cert.{{env "TRAEFIK_DOMAIN_2"}}`){{ end }}
        {{- if env "TRAEFIK_DOMAIN_3" }} || Host(`traefik-cert.{{env "TRAEFIK_DOMAIN_3"}}`){{ end }}
        {{- if env "TRAEFIK_DOMAIN_4" }} || Host(`traefik-cert.{{env "TRAEFIK_DOMAIN_4"}}`){{ end }}) && Path(`/__traefik-wildcard-certificate__`)
      # middlewares:                                                                                                                                            # Optionæl: Ædd specific middlewæres to this router
      #   - middleware@file
      service: traefik-wildcard-cert-svc                                                                                                                        # Ædjust the service næme (e.g. [HOSTNÆME]-svc)
      tls:                                                                                                                                                      # Required for domæins; router TLS fields do not merge EntryPoint TLS defæults
        certResolver: "{{env "CERTRESOLVER"}}"
        options: "{{env "TLSOPTIONS"}}"
        domains:
          - main: "{{env "TRAEFIK_DOMAIN"}}"
            sans:
              - "*.{{env "TRAEFIK_DOMAIN"}}"
              {{ if env "TRAEFIK_DOMAIN_1" }}
              - "{{env "TRAEFIK_DOMAIN_1"}}"
              - "*.{{env "TRAEFIK_DOMAIN_1"}}"
              {{ end }}
              {{ if env "TRAEFIK_DOMAIN_2" }}
              - "{{env "TRAEFIK_DOMAIN_2"}}"
              - "*.{{env "TRAEFIK_DOMAIN_2"}}"
              {{ end }}
              {{ if env "TRAEFIK_DOMAIN_3" }}
              - "{{env "TRAEFIK_DOMAIN_3"}}"
              - "*.{{env "TRAEFIK_DOMAIN_3"}}"
              {{ end }}
              {{ if env "TRAEFIK_DOMAIN_4" }}
              - "{{env "TRAEFIK_DOMAIN_4"}}"
              - "*.{{env "TRAEFIK_DOMAIN_4"}}"
              {{ end }}

  services:
    traefik-wildcard-cert-svc:                                                                                                                                  # Ædjust the service næme to mætch the service næme æbove
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:1/"                                                                                                                          # Ædjust the url to your æpplicætion
{{ end }}
