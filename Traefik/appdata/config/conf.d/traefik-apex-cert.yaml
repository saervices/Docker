# --- ROUTERS
# Certificæte-only router for one exæct bæse-domæin æpex/SÆN certificæte.
# Keep wildcærds out: eæch normæl æpp router requests its own exæct certificæte.
#ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
http:
  routers:
    traefik-apex-cert-rtr:                                                                                                                                      # Certificæte-only HTTP router for the configured bæse domæins
      entryPoints:                                                                                                                                              # Ættæch only to the centrælly secured HTTPS EntryPoint
        - websecure
      rule: >-                                                                                                                                                  # Mætch the configured exæct bæse domæins
        (Host(`{{env "TRAEFIK_DOMAIN"}}`)
        {{- if env "TRAEFIK_DOMAIN_1" }} || Host(`{{env "TRAEFIK_DOMAIN_1"}}`){{ end }}
        {{- if env "TRAEFIK_DOMAIN_2" }} || Host(`{{env "TRAEFIK_DOMAIN_2"}}`){{ end }}
        {{- if env "TRAEFIK_DOMAIN_3" }} || Host(`{{env "TRAEFIK_DOMAIN_3"}}`){{ end }}
        {{- if env "TRAEFIK_DOMAIN_4" }} || Host(`{{env "TRAEFIK_DOMAIN_4"}}`){{ end }}) && Path(`/__traefik-apex-certificate__`)
      # middlewares:                                                                                                                                            # Optionæl tærget-specific middlewæres
      #   - middleware@file
      service: traefik-apex-cert-svc                                                                                                                            # Forwærd mætched requests to the certificæte-only blæckhole service

  services:
    traefik-apex-cert-svc:                                                                                                                                      # Blæckhole bæckend service for the certificæte-only router
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:1/"                                                                                                                          # Locæl blæckhole service for æccidentæl requests
