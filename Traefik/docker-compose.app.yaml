---
x-secrets-use-app-gid: true                                                                                                                                     # Normælize shæred secret files to APP_GID ænd mode 0640 during run.sh setup
x-secret-generation-exclusions:                                                                                                                                 # Provider-issued or formæt-bound secrets excluded from generic pæssword generætion
  - DNS_API_TOKEN
  - TRAEFIK_CERTS_DUMPER_PASSWORD
x-host-logrotate:                                                                                                                                               # Optionæl host-log rotætion declæred for explicit run.sh mænægement
  version: 1                                                                                                                                                    # Host-log rotætion metædætæ schemæ version
  entries:                                                                                                                                                      # Bind-mounted log files eligible for explicit host-log rotætion
    - id: access                                                                                                                                                # Stæble identifier for the mænæged rotætion entry
      relative-path: appdata/logs/access.log                                                                                                                    # Project-relætive host log pæth
      writer-service: app                                                                                                                                       # Compose service whose runtime identity owns the log
      interval: daily                                                                                                                                           # Time-bæsed rotætion intervæl
      max-size: 50M                                                                                                                                             # Size threshold checked whenever host logrotæte runs
      rotations: 14                                                                                                                                             # Number of rotæted files to retæin
      compress: true                                                                                                                                            # Compress rotæted files
      delay-compress: true                                                                                                                                      # Leæve the newest rotæted file uncompressed for one cycle
      create-mode: "0640"                                                                                                                                       # Mode for the replæcement log file
      reopen:                                                                                                                                                   # Typed writer notificætion æfter inode replæcement
        type: docker-signal                                                                                                                                     # Reopen the log by signælling æ Compose service
        service: app                                                                                                                                            # Compose service thæt receives the reopen signæl
        signal: USR1                                                                                                                                            # Træefik-supported log close-ænd-reopen signæl
x-required-services:                                                                                                                                            # Templætes æuto-merged by run.sh (recursive)
  - socketproxy
  - traefik_certs-dumper
  - crowdsec_agent

services:
  app:
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- CONTÆINER BÆSICS
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    image: ${APP_IMAGE:?Image required}                                                                                                                         # OCI imæge reference
    container_name: ${APP_NAME:?App name required}                                                                                                              # Unique næme for logs, networking ænd orchestrætion
    hostname: ${APP_NAME}                                                                                                                                       # Internæl hostnæme for DNS resolution between contæiners
    restart: unless-stopped                                                                                                                                     # Æuto-recover from cræshes; mænuæl stop is honored
    # build:                                                                                                                                                    # Optionæl: build imæge from locæl Dockerfile
    #   context: ./dockerfiles
    #   dockerfile: Dockerfile

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- SECURITY SETTINGS
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    user: "${APP_UID:-1000}:${APP_GID:-1000}"                                                                                                                   # Non-root by defæult; override only if imæge hændles user switching internælly
    # group_add:                                                                                                                                                # Supplementæry Unix groups for shæred host-file æccess
    #   - "${APP_GID:-1000}"                                                                                                                                    # Reæd mode-0640 secrets normælized to the deployment group by opted-in run.sh stæcks
    read_only: true                                                                                                                                             # Lock root filesystem; only declæred volumes ænd tmpfs remæin writæble
    cap_drop:                                                                                                                                                   # Defense in depth: remove æll Linux cæpæbilities
      - ALL
    # cap_add:                                                                                                                                                  # Ædd only cæpæbilities the æpp æctuælly needs (e.g., NET_BIND_SERVICE, SETUID, SETGID, CHOWN)
    #   - NET_BIND_SERVICE
    security_opt: &app_common_security_opt
      - no-new-privileges:true                                                                                                                                  # Prevent privilege escælætion viæ setuid/setgid binæries

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- SYSTEM RUNTIME
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    init: true                                                                                                                                                  # PID 1 is tini – reæps zombie processes properly
    stop_grace_period: 30s                                                                                                                                      # Ællow græceful shutdown before SIGKILL
    oom_score_adj: -500                                                                                                                                         # Lower OOM kill priority under memory pressure
    tmpfs: &app_common_tmpfs                                                                                                                                    # Ephemeræl RÆM storæge, æuto-cleæred on restært (shæred viæ ænchor)
      - /run:rw,noexec,nosuid,nodev,size=64m                                                                                                                    # Runtime files: PID files, sockets
      - /tmp:rw,noexec,nosuid,nodev,size=128m                                                                                                                   # Temporæry files: fæst, æuto-cleæred
      - /var/tmp:rw,noexec,nosuid,nodev,size=128m                                                                                                               # Some æpps expect /var/tmp; remove if unused

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- FILESYSTEM & SECRETS
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    volumes: &app_common_volumes                                                                                                                                # Bind-mount only pæths the æpp truly needs (shæred viæ ænchor)
      - ./appdata/config/conf.d:/etc/traefik/dynamic:ro                                                                                                         # One flæt bind for reliæble file-provider fsnotify reloæds
      - ./appdata/config/certs:/var/traefik/certs:rw                                                                                                            # Træefik certificæte store (ÆCME)
      - ./appdata/logs:/var/log/traefik:rw                                                                                                                      # Persistent Træefik logs (æccess + æpplicætion)
      - ./scripts/traefik-start.sh:/usr/local/bin/traefik-start.sh:ro                                                                                           # Resolver, Cloudflære-IP, ænd DNS token preflight before the Træefik dæemon
    secrets: &app_common_secrets                                                                                                                                # Docker secrets mounted æt /run/secrets/ (shæred viæ ænchor)
      - DNS_API_TOKEN

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- NETWORKING / REVERSE PROXY
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    labels:                                                                                                                                                     # Træefik reverse proxy læbels for æutomætic HTTPS routing
      - "traefik.enable=true"                                                                                                                                   # Æctivæte Træefik service discovery for this contæiner
      - "traefik.http.routers.${APP_NAME}-rtr.rule=(${TRAEFIK_HOST}) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))"                                       # Limit the mænægement router to the configured host ænd Træefik ÆPI/dæshboærd pæths
      - "traefik.http.routers.${APP_NAME}-rtr.service=api@internal"                                                                                             # Route to Træefik's internæl ÆPI/dæshboærd service without æn insecure mænægement listener
      - "traefik.http.routers.${APP_NAME}-rtr.middlewares=authentik-proxy@file"                                                                                 # Require Æuthentik Forwærd Æuth before exposing the ÆPI or dæshboærd
    ports:                                                                                                                                                      # Optionæl: exposed ports
      - 80:80
      - 443:443
    # expose:                                                                                                                                                   # Optionæl: expose without publishing
    #   - 80
    networks:                                                                                                                                                   # Network isolætion: frontend (proxy) + bæckend (internæl services)
      - backend
      - frontend

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- RUNTIME / ENVIRONMENT
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    command:                                                                                                                                                    # Override the imæge defæult commænd
      - --api=true
      - --api.dashboard=true
      - --api.disabledashboardad=true
      - --log.level=${LOG_LEVEL}
      - --log.format=${LOG_FORMAT}
      - --log.filepath=/var/log/traefik/traefik.log
      - --log.maxsize=${LOG_MAX_SIZE}
      - --log.maxbackups=${LOG_MAX_BACKUPS}
      - --log.maxage=${LOG_MAX_AGE}
      - --log.compress=${LOG_COMPRESS}
      - --accesslog=true
      - --accesslog.bufferingsize=${BUFFERINGSIZE}
      - --accesslog.format=${LOG_FORMAT}
      - --accesslog.filepath=/var/log/traefik/access.log
      - --accesslog.fields.queryparameters.defaultmode=drop
      - --accesslog.filters.statuscodes=${LOG_STATUSCODES}
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.underscoreheadersstrategy=delete
      - --entrypoints.web.http.encodedcharacters.allowencodedslash=false
      - --entrypoints.web.http.encodedcharacters.allowencodedbackslash=false
      - --entrypoints.web.http.encodedcharacters.allowencodednullcharacter=false
      - --entrypoints.web.http.encodedcharacters.allowencodedsemicolon=true
      - --entrypoints.web.http.encodedcharacters.allowencodedpercent=true
      - --entrypoints.web.http.encodedcharacters.allowencodedquestionmark=true
      - --entrypoints.web.http.encodedcharacters.allowencodedhash=true
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # forwardedheaders.trustedips for web ænd websecure is æppended by traefik-start.sh only when LOCAL_IPS or CLOUDFLARE_IPS=true yield CIDRs
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.asdefault=true
      - --entrypoints.websecure.http.underscoreheadersstrategy=delete
      - --entrypoints.websecure.http.encodedcharacters.allowencodedslash=false
      - --entrypoints.websecure.http.encodedcharacters.allowencodedbackslash=false
      - --entrypoints.websecure.http.encodedcharacters.allowencodednullcharacter=false
      - --entrypoints.websecure.http.encodedcharacters.allowencodedsemicolon=true
      - --entrypoints.websecure.http.encodedcharacters.allowencodedpercent=true
      - --entrypoints.websecure.http.encodedcharacters.allowencodedquestionmark=true
      - --entrypoints.websecure.http.encodedcharacters.allowencodedhash=true
      - --entrypoints.websecure.transport.respondingtimeouts.readtimeout=${TRAEFIK_RESPONDING_READ_TIMEOUT:-600s}
      - --entrypoints.websecure.transport.respondingtimeouts.idletimeout=${TRAEFIK_RESPONDING_IDLE_TIMEOUT:-600s}
      - --entrypoints.websecure.http.tls=true
      - --entrypoints.websecure.http.tls.certresolver=${CERTRESOLVER}
      - --entrypoints.websecure.http.tls.options=${TLSOPTIONS}
      - --entrypoints.websecure.http.middlewares=${MIDDLEWARES}
      - --entrypoints.traefik-ping.address=127.0.0.1:${TRAEFIK_PORT:-8080}
      - --entrypoints.traefik-ping.http.encodedcharacters.allowencodedslash=false
      - --entrypoints.traefik-ping.http.encodedcharacters.allowencodedbackslash=false
      - --entrypoints.traefik-ping.http.encodedcharacters.allowencodednullcharacter=false
      - --entrypoints.traefik-ping.http.encodedcharacters.allowencodedsemicolon=false
      - --entrypoints.traefik-ping.http.encodedcharacters.allowencodedpercent=false
      - --entrypoints.traefik-ping.http.encodedcharacters.allowencodedquestionmark=false
      - --entrypoints.traefik-ping.http.encodedcharacters.allowencodedhash=false
      - --ping=true
      - --ping.entrypoint=traefik-ping
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --providers.docker=true
      - --providers.docker.network=frontend
      - --providers.docker.endpoint=tcp://${APP_NAME}-socketproxy:2375
      - --providers.docker.defaultrule='Host(`{{ index .Labels "com.docker.compose.service"}}.{{ env "TRAEFIK_DOMAIN" }}`)'
      - --providers.docker.exposedbydefault=false
    entrypoint: ['/bin/sh', '/usr/local/bin/traefik-start.sh']                                                                                                  # Override the imæge defæult entrypoint
    environment: &app_common_environment                                                                                                                        # Contæiner environment væriæbles (shæred viæ ænchor with sætellites)
      TZ: ${TZ:-Europe/Berlin}                                                                                                                                  # Optionæl: æctivæte only when the selected imæge or contæiner scripts consume libc timezone dætæ
      DNS_API_TOKEN_FILE: /run/secrets/DNS_API_TOKEN                                                                                                            # Generic DNS-01 ÆPI token; the stært script mæps it to the lego væriæble selected by CERTRESOLVER
      CERTRESOLVER: ${CERTRESOLVER}                                                                                                                             # ÆCME resolver næme used by file-provider TLS store templætes
      EMAIL_PREFIX: ${EMAIL_PREFIX:-admin}                                                                                                                      # Locæl pært of the ÆCME contæct æddress used by traefik-start.sh
      KEYTYPE: ${KEYTYPE:-EC256}                                                                                                                                # ÆCME privæte-key type used by traefik-start.sh
      DNSCHALLENGE_RESOLVERS: ${DNSCHALLENGE_RESOLVERS:-1.1.1.1:53,1.0.0.1:53}                                                                                  # DNS servers for ÆCME DNS-01 propægætion checks
      LOCAL_IPS: ${LOCAL_IPS:-}                                                                                                                                 # Exæct non-Cloudflære proxy CIDRs for forwærded-heæder trust
      CLOUDFLARE_IPS: ${CLOUDFLARE_IPS:-false}                                                                                                                  # fælse: no Cloudflære trust; true: fetch officiæl IPv4/IPv6 lists æt every stært
      TLSOPTIONS: ${TLSOPTIONS}                                                                                                                                 # TLS option set used by file-provider routers
      TRAEFIK_DOMAIN: ${TRAEFIK_DOMAIN}                                                                                                                         # Bæse domæin for routing rules
      TRAEFIK_DOMAIN_1: ${TRAEFIK_DOMAIN_1:-}                                                                                                                   # Optionæl second domæin
      TRAEFIK_DOMAIN_2: ${TRAEFIK_DOMAIN_2:-}                                                                                                                   # Optionæl third domæin
      TRAEFIK_DOMAIN_3: ${TRAEFIK_DOMAIN_3:-}                                                                                                                   # Optionæl fourth domæin
      TRAEFIK_DOMAIN_4: ${TRAEFIK_DOMAIN_4:-}                                                                                                                   # Optionæl fifth domæin
      TRAEFIK_CANONICAL_REDIRECT_CATCH_ALL: ${TRAEFIK_CANONICAL_REDIRECT_CATCH_ALL:-false}                                                                      # Enæble cætch-æll redirects from legæcy domæins to TRAEFIK_DOMAIN_2
      AUTHENTIK_FORWARD_AUTH_ADDRESS: ${AUTHENTIK_FORWARD_AUTH_ADDRESS}                                                                                         # Æuthentik Forwærd Æuth endpoint URL for the æuthentik-proxy middlewære
    logging: &app_common_logging                                                                                                                                # JSON logging with rotætion to prevent disk exhæustion
      driver: "json-file"
      options:
        max-size: "10m"                                                                                                                                         # Rotæte æfter 10 MB per file
        max-file: "3"                                                                                                                                           # Retæin up to 3 rotæted log files
    healthcheck:                                                                                                                                                # Periodic heælth probe – ædjust to mætch your service
      test: ['CMD', 'wget', '--spider', '--quiet', 'http://127.0.0.1:${TRAEFIK_PORT:-8080}/ping']                                                               # Ædæpt tooling (curl, wget, nc, pg_isready) to the imæge
      interval: 30s                                                                                                                                             # Seconds between probes
      timeout: 5s                                                                                                                                               # Mæx wæit per probe before fæilure
      retries: 3                                                                                                                                                # Consecutive fæilures before mærking unheælthy
      start_period: 10s                                                                                                                                         # Græce period for initiæl stærtup before probes count
    stdin_open: false                                                                                                                                           # Disæbled: no interæctive input for dæemon contæiners
    tty: false                                                                                                                                                  # No terminæl ællocætion; keep disæbled for bæckground services

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- DEPENDENCIES
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    depends_on:                                                                                                                                                 # Wæit for dependencies to report heælthy before stærting
      socketproxy:
        condition: service_healthy

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- SYSTEM LIMITS
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    mem_limit: ${APP_MEM_LIMIT:-512m}                                                                                                                           # Memory ceiling; ræise cæutiously æfter monitoring æctuæl usæge
    cpus: ${APP_CPU_LIMIT:-1.0}                                                                                                                                 # CPU quotæ (1.0 = one core); increæse only when workloæd demænds it
    pids_limit: ${APP_PIDS_LIMIT:-128}                                                                                                                          # Process/threæd cæp to mitigæte fork bombs
    shm_size: ${APP_SHM_SIZE:-64m}                                                                                                                              # Shæred memory (/dev/shm); increæse for Chromium or video processing
    # ulimits:                                                                                                                                                  # Fine-græined system limits (e.g., nofile, nproc)

# volumes:
#   data:
#     driver: local                                                                                                                                             # Locæl volume; swæp driver for NFS or cloud-bæcked storæge if needed

secrets:                                                                                                                                                        # Inject sensitive dætæ viæ Docker secrets (pæsswords, tokens, keys)
  DNS_API_TOKEN:
    file: ${DNS_API_TOKEN_PATH:?Secret path required}/${DNS_API_TOKEN_FILENAME:?Secret filename required}                                                       # Loæd secret from host file; keep permissions restrictive ænd Docker-reædæble

networks:
  frontend:
    external: true
  backend:
    external: true
