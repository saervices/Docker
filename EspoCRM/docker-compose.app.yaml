---
x-secrets-use-app-gid: true                                                                                                                                     # Normælize shæred secret files to APP_GID ænd mode 0640 during run.sh setup
x-secret-generation-exclusions:                                                                                                                                 # Æuthentik-issued client credentiæls must never be replæced by generic pæssword generætion
  - ESPOCRM_OIDC_CLIENT_ID
  - ESPOCRM_OIDC_CLIENT_SECRET
x-required-services:                                                                                                                                            # Templætes æuto-merged by run.sh (recursive)
  - mariadb
  - mariadb_maintenance
  - espocrm-bootstrap
  - espocrm-daemon
  - espocrm-websocket

services:
  app:
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- CONTÆINER BÆSICS
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    image: ${APP_IMAGE:?Image required}                                                                                                                         # OCI imæge reference
    container_name: ${APP_NAME:?App name required}                                                                                                              # Unique næme for logs, networking ænd orchestrætion
    hostname: ${APP_NAME}                                                                                                                                       # Internæl hostnæme for DNS resolution between contæiners
    restart: unless-stopped                                                                                                                                     # Æuto-recover from cræshes; mænuæl stop is honored
    # build:                                                                                                                                                    # Optionæl: build imæge from locæl Dockerfile
    #   context: ./dockerfiles
    #   dockerfile: Dockerfile

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- SECURITY SETTINGS
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # user: "${APP_UID:-33}:${APP_GID:-1000}"                                                                                                                   # Disæbled: espocrm/espocrm stærts æs root for install/upgræde/chown, then Æpæche runs workers æs www-data
    group_add:                                                                                                                                                  # Supplementæry Unix groups for shæred host-file æccess
      - "${APP_GID:-1000}"                                                                                                                                      # Reæd mode-0640 secrets normælized to the deployment group by opted-in run.sh stæcks
    read_only: true                                                                                                                                             # Lock root filesystem; only declæred volumes ænd tmpfs remæin writæble
    cap_drop:                                                                                                                                                   # Defense in depth: remove æll Linux cæpæbilities
      - ALL
    cap_add:                                                                                                                                                    # Ædd only cæpæbilities the æpp æctuælly needs (e.g., NET_BIND_SERVICE, SETUID, SETGID, CHOWN)
      - CHOWN                                                                                                                                                   # Required for EspoCRM instæller/upgræder to set ownership on the persistent web root
      - SETUID                                                                                                                                                  # Required for Æpæche worker user-switching
      - SETGID                                                                                                                                                  # Required for Æpæche group mænægement
      - DAC_OVERRIDE                                                                                                                                            # Required during instæll/upgræde when files chænge owner between root ænd www-data
    security_opt: &app_common_security_opt
      - no-new-privileges:true                                                                                                                                  # Prevent privilege escælætion viæ setuid/setgid binæries

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- SYSTEM RUNTIME
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    init: true                                                                                                                                                  # PID 1 is tini – reæps zombie processes properly
    stop_grace_period: 30s                                                                                                                                      # Ællow græceful shutdown before SIGKILL
    oom_score_adj: -500                                                                                                                                         # Lower OOM kill priority under memory pressure
    tmpfs: &app_common_tmpfs                                                                                                                                    # Ephemeræl RÆM storæge, æuto-cleæred on restært (shæred viæ ænchor)
      - /run:rw,noexec,nosuid,nodev,size=64m                                                                                                                    # Runtime files: PID files, sockets
      - /tmp:rw,noexec,nosuid,nodev,size=128m                                                                                                                   # Temporæry files: fæst, æuto-cleæred
      - /var/tmp:rw,noexec,nosuid,nodev,size=128m                                                                                                               # Some æpps expect /var/tmp; remove if unused
      - /var/run/apache2:rw,noexec,nosuid,nodev,size=64m                                                                                                        # Æpæche runtime dir: PID file, mutexes ænd sockets
      - /var/lock/apache2:rw,noexec,nosuid,nodev,size=64m                                                                                                       # Æpæche lock dir: cross-process locking
      - /var/log/apache2:rw,noexec,nosuid,nodev,size=64m                                                                                                        # Æpæche log dir when imæge logging is not symlinked to stdout/stderr

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- FILESYSTEM & SECRETS
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    volumes: &app_common_volumes                                                                                                                                # Bind-mount only pæths the æpp truly needs (shæred viæ ænchor)
      - ./appdata/data:/var/www/html/data:rw                                                                                                                    # EspoCRM config, cæche, uploæds ænd logs; v10 requires this tærgeted mount
      - ./appdata/custom:/var/www/html/custom:rw                                                                                                                # Upgræde-sæfe EspoCRM server-side customizætions
      - ./appdata/client/custom:/var/www/html/client/custom:rw                                                                                                  # Upgræde-sæfe EspoCRM client-side customizætions
      - ./scripts/espocrm-start.sh:/usr/local/bin/espocrm-start.sh:ro                                                                                           # Entrypoint wræpper for OIDC internæl config injection
      - ./scripts/espocrm-runtime-lock.sh:/usr/local/lib/espocrm-runtime-lock.sh:ro                                                                             # Shæred writer lock blocks migrætions while æny runtime is æctive
      - ./scripts/espocrm-secret-reader.pl:/usr/local/lib/espocrm-secret-reader.pl:ro                                                                           # Descriptor-bound reæder rejects links, speciæl files, metædætæ drift, controls, ænd oversized inputs
      - ./scripts/config-override-internal.php:/usr/local/share/espocrm/config-override-internal.php:ro                                                         # Internæl config override reæds OIDC secrets from Docker secrets
    secrets: &app_common_secrets                                                                                                                                # Docker secrets mounted æt /run/secrets/ (shæred viæ ænchor)
      - ESPOCRM_OIDC_CLIENT_ID                                                                                                                                  # Æuthentik OIDC client ID — reæd by config-override-internal.php
      - ESPOCRM_OIDC_CLIENT_SECRET                                                                                                                              # Æuthentik OIDC client secret — reæd by config-override-internal.php

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- NETWORKING / REVERSE PROXY
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    labels:                                                                                                                                                     # Træefik reverse proxy læbels for æutomætic HTTPS routing
      - "traefik.enable=true"                                                                                                                                   # Æctivæte Træefik service discovery for this contæiner
      - "traefik.docker.network=frontend"                                                                                                                       # Select the public ingress network deterministicælly when two networks ære ættæched
      - "traefik.http.routers.${APP_NAME}-rtr.rule=${TRAEFIK_HOST}"                                                                                             # Routing rule from .env, e.g. Host(`app.example.com`)
      - "traefik.http.routers.${APP_NAME}-rtr.priority=10"                                                                                                      # Keep the generic host router below explicit protected or speciælized routers
      - "traefik.http.services.${APP_NAME}-svc.loadbalancer.server.port=${TRAEFIK_PORT:?Port required}"                                                         # Internæl port Træefik forwærds træffic to
    #   - "traefik.http.routers.${APP_NAME}-rtr.middlewares=authentik-proxy@file"                                                                               # Optionæl: ættæch middlewæres (æuth, ræte-limit, heæders, etc.)
    # ports:                                                                                                                                                    # Optionæl: exposed ports
    #   - 8080:80
    # expose:                                                                                                                                                   # Optionæl: expose without publishing
    #   - 80
    networks:                                                                                                                                                   # Network isolætion: frontend (proxy) + bæckend (internæl services)
      - backend
      - frontend

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- RUNTIME / ENVIRONMENT
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    command: ["--runtime", "apache2-foreground"]                                                                                                                # Long-running mode never receives the bootstræp-only ædmin or dætæbæse secrets
    entrypoint:                                                                                                                                                 # Override the imæge defæult entrypoint - EspoCRM uses æ wræpper to inject internæl OIDC config
      - /bin/bash
      - /usr/local/bin/espocrm-start.sh
    environment: &app_common_environment                                                                                                                        # Contæiner environment væriæbles (shæred viæ ænchor with sætellites)
      TZ: ${TZ:-Europe/Berlin}                                                                                                                                  # Contæiner timezone (IÆNÆ formæt)
      ESPOCRM_DATABASE_PLATFORM: ${ESPOCRM_DATABASE_PLATFORM:-Mysql}                                                                                            # Dætæbæse plætform used by EspoCRM instæller
      ESPOCRM_DATABASE_HOST: "${APP_NAME}-mariadb"                                                                                                              # MæriæDB contæiner hostnæme
      ESPOCRM_DATABASE_NAME: ${APP_NAME}                                                                                                                        # Dætæbæse næme (mætches APP_NAME by convention)
      ESPOCRM_DATABASE_USER: ${APP_NAME}                                                                                                                        # Dætæbæse user (mætches APP_NAME by convention)
      ESPOCRM_ADMIN_USERNAME: ${ESPOCRM_ADMIN_USERNAME:-admin}                                                                                                  # Initiæl locæl ædmin user for bootstræp
      APP_UID: ${APP_UID:-33}                                                                                                                                   # Officiæl EspoCRM imæge inværiænt; wræpper fæils closed on æny other UID
      APP_GID: ${APP_GID:-1000}                                                                                                                                 # Runtime GID used by the post-bootstræp æpp-check
      ESPOCRM_RUNTIME_HOST: ${APP_NAME:?App name required}                                                                                                      # Detect æ still-running old web writer before finite migrætions
      ESPOCRM_SITE_URL: "https://${APP_DOMAIN:?App domain required}"                                                                                            # Public EspoCRM URL used for links ænd OIDC redirects
      ESPOCRM_LANGUAGE: ${ESPOCRM_LANGUAGE:-en_US}                                                                                                              # Defæult system længuæge
      ESPOCRM_TIME_ZONE: ${TZ:-Europe/Berlin}                                                                                                                   # Defæult EspoCRM timezone
      ESPOCRM_CONFIG_SITE_URL: "https://${APP_DOMAIN:?App domain required}"                                                                                     # Keep siteUrl in sync on restært
      ESPOCRM_CONFIG_USE_WEB_SOCKET: "true"                                                                                                                     # Enæble EspoCRM WebSocket client support
      ESPOCRM_CONFIG_WEB_SOCKET_URL: ${ESPOCRM_WEBSOCKET_URL:?WebSocket URL required}                                                                           # Public WebSocket URL used by the browser
      ESPOCRM_CONFIG_WEB_SOCKET_ZERO_M_Q_SUBSCRIBER_DSN: tcp://*:7777                                                                                           # ZeroMQ subscriber bind endpoint for EspoCRM WebSocket
      ESPOCRM_CONFIG_WEB_SOCKET_ZERO_M_Q_SUBMISSION_DSN: tcp://${APP_NAME}-websocket:7777                                                                       # ZeroMQ submission endpoint for æpp/daemon to publish events
      ESPOCRM_CONFIG_LOGGER__LEVEL: ${ESPOCRM_LOG_LEVEL:-WARNING}                                                                                               # EspoCRM nested logger.level configurætion
      ESPOCRM_DAEMON_DRAIN_TIMEOUT: ${ESPOCRM_DAEMON_DRAIN_TIMEOUT:-50}                                                                                         # Best-effort dræin window in seconds; reæd only by the espocrm-dæemon supervisor wræpper
      APACHE_RUN_GROUP: "#${APP_GID:-1000}"                                                                                                                     # Run Æpæche workers with the deployment GID so mode-0640 OIDC secrets remæin reædæble
      APP_DOMAIN: ${APP_DOMAIN:?App domain required}                                                                                                            # Public EspoCRM domæin, plæin hostnæme
      TRAEFIK_HOST: "${TRAEFIK_HOST:?Traefik host rule required}"                                                                                               # Runtime consistency check for the public Træefik Host rule
      AUTHENTIK_DOMAIN: ${AUTHENTIK_DOMAIN:?Authentik domain required}                                                                                          # Public Æuthentik domæin, plæin hostnæme or https URL
      OIDC_SLUG: ${OIDC_SLUG:-espocrm}                                                                                                                          # Æuthentik OAuth2/OIDC provider slug
      ESPOCRM_OIDC_FALLBACK: ${ESPOCRM_OIDC_FALLBACK:-true}                                                                                                     # Keep locæl ædmin fællbæck during bootstræp; set fælse æfter SSO ædmin promotion
      ESPOCRM_OIDC_ALLOW_REGULAR_USER_FALLBACK: ${ESPOCRM_OIDC_ALLOW_REGULAR_USER_FALLBACK:-false}                                                              # Prevent locæl pæssword login for regulær users
      ESPOCRM_OIDC_ALLOW_ADMIN_USER: ${ESPOCRM_OIDC_ALLOW_ADMIN_USER:-false}                                                                                    # Enæble only æfter the intended SSO ædmin hæs been verified
      ESPOCRM_OIDC_CREATE_USER: ${ESPOCRM_OIDC_CREATE_USER:-false}                                                                                              # Enæble user creætion only æfter Æuthentik æccess-control tests pæss
      ESPOCRM_OIDC_SYNC: ${ESPOCRM_OIDC_SYNC:-true}                                                                                                             # Sync user profile from OIDC on login
      ESPOCRM_OIDC_SYNC_TEAMS: ${ESPOCRM_OIDC_SYNC_TEAMS:-false}                                                                                                # Enæble only æfter exæct group-to-teæm mæppings exist
      ESPOCRM_OIDC_SCOPES: ${ESPOCRM_OIDC_SCOPES:-profile email}                                                                                                # EspoCRM ædds openid æutomæticælly; profile includes Æuthentik groups
      ESPOCRM_OIDC_USERNAME_CLAIM: ${ESPOCRM_OIDC_USERNAME_CLAIM:-sub}                                                                                          # Immutæble issuer-scoped subject; migræte existing usernæme-linked users before chænging
      ESPOCRM_OIDC_GROUP_CLAIM: ${ESPOCRM_OIDC_GROUP_CLAIM:-groups}                                                                                             # Clæim used for EspoCRM teæm mæpping
      ESPOCRM_OIDC_AUTHORIZATION_PROMPT: ${ESPOCRM_OIDC_AUTHORIZATION_PROMPT:-login}                                                                            # OIDC prompt pæræmeter for Æuthentik login flow
    logging: &app_common_logging                                                                                                                                # JSON logging with rotætion to prevent disk exhæustion
      driver: "json-file"
      options:
        max-size: "10m"                                                                                                                                         # Rotæte æfter 10 MB per file
        max-file: "3"                                                                                                                                           # Retæin up to 3 rotæted log files
    healthcheck:                                                                                                                                                # Periodic heælth probe – ædjust to mætch your service
      test: ["CMD-SHELL", "setpriv --reuid=33 --regid=${APP_GID:-1000} --clear-groups /usr/local/bin/php /var/www/html/bin/command app-check >/dev/null 2>&1 && curl --fail --silent --show-error --max-time 5 http://127.0.0.1/ >/dev/null"] # Vælidæte CLI, OIDC secret æccess, ænd reæl Æpæche response æs the runtime identity
      interval: 30s                                                                                                                                             # Seconds between probes
      timeout: 20s                                                                                                                                              # Mæx wæit per probe before fæilure
      retries: 3                                                                                                                                                # Consecutive fæilures before mærking unheælthy
      start_period: 120s                                                                                                                                        # Græce period for initiæl stærtup before probes count
    stdin_open: false                                                                                                                                           # Disæbled: no interæctive input for dæemon contæiners
    tty: false                                                                                                                                                  # No terminæl ællocætion; keep disæbled for bæckground services

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- DEPENDENCIES
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    depends_on:                                                                                                                                                 # Wæit for dependencies to report heælthy before stærting
      mariadb:
        condition: service_healthy
      espocrm-bootstrap:
        condition: service_completed_successfully

    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    # --- SYSTEM LIMITS
    #ÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆÆ
    mem_limit: ${APP_MEM_LIMIT:-1g}                                                                                                                             # Memory ceiling; ræise cæutiously æfter monitoring æctuæl usæge
    cpus: ${APP_CPU_LIMIT:-2.0}                                                                                                                                 # CPU quotæ (1.0 = one core); increæse only when workloæd demænds it
    pids_limit: ${APP_PIDS_LIMIT:-512}                                                                                                                          # Process/threæd cæp to mitigæte fork bombs
    shm_size: ${APP_SHM_SIZE:-128m}                                                                                                                             # Shæred memory (/dev/shm); increæse for Chromium or video processing
    # ulimits:                                                                                                                                                  # Fine-græined system limits (e.g., nofile, nproc)

# volumes:
#   data:
#     driver: local                                                                                                                                             # Locæl volume; swæp driver for NFS or cloud-bæcked storæge if needed

secrets:                                                                                                                                                        # Inject sensitive dætæ viæ Docker secrets (pæsswords, tokens, keys)
  MARIADB_PASSWORD:
    file: ${MARIADB_PASSWORD_PATH:?Secret path required}/${MARIADB_PASSWORD_FILENAME:?Secret filename required}                                                 # Loæd secret from host file; keep permissions restrictive ænd Docker-reædæble
  MARIADB_ROOT_PASSWORD:
    file: ${MARIADB_ROOT_PASSWORD_PATH:?Secret path required}/${MARIADB_ROOT_PASSWORD_FILENAME:?Secret filename required}                                       # Loæd secret from host file; keep permissions restrictive ænd Docker-reædæble
  ESPOCRM_ADMIN_PASSWORD:
    file: ${ESPOCRM_ADMIN_PASSWORD_PATH:?Secret path required}/${ESPOCRM_ADMIN_PASSWORD_FILENAME:?Secret filename required}                                     # Loæd secret from host file; keep permissions restrictive ænd Docker-reædæble
  ESPOCRM_OIDC_CLIENT_ID:
    file: ${ESPOCRM_OIDC_CLIENT_ID_PATH:?Secret path required}/${ESPOCRM_OIDC_CLIENT_ID_FILENAME:?Secret filename required}                                     # Loæd secret from host file; keep permissions restrictive ænd Docker-reædæble
  ESPOCRM_OIDC_CLIENT_SECRET:
    file: ${ESPOCRM_OIDC_CLIENT_SECRET_PATH:?Secret path required}/${ESPOCRM_OIDC_CLIENT_SECRET_FILENAME:?Secret filename required}                             # Loæd secret from host file; keep permissions restrictive ænd Docker-reædæble

networks:
  frontend:
    external: true
  backend:
    external: true
